name: "Tests (matrix)"

# One job per test, generated from the repository's own discovery contract.
#
# The per-repository `run-all-tests.sh` files forked into ten variants, each with
# its own scheduling and exit conventions, so a suite run's shape depended on which
# repository you were in. A matrix fixes the shape without unifying those files:
#
#   list  discovers the entrypoints through `scripts/lib/discover-tests.sh` (the one
#         file that IS byte-identical everywhere) and emits a JSON matrix;
#   test  runs exactly one entrypoint per job via `tests/run-one.sh`.
#
# Consequences worth stating, because they are the reason for the change:
#   - fail-fast is a local convenience, not a CI property: `fail-fast: false` here
#     means one run reports every failure. A local run can still stop early;
#   - a wedged test occupies one job, not the whole suite;
#   - a `flake.lock` bump re-runs everything, which is what "bump lock" should do.
# TRUST MODEL: no pull_request trigger, on purpose.
#
# The matrix runs the repository's own test code, and on a pull request that code is
# whatever the contributor wrote -- including the workflow file itself, when the
# branch lives in this repository. Read-only permissions bound the damage, but they do
# not make it zero: the run still occupies runners, can print its token, and can add
# cache or artifact entries. The alternative implemented here is to not run untrusted
# code at all.
#
# What that costs: a pull request gets no suite result before merge. To validate one,
# either land it (push to main) or, for a branch in this repository, dispatch this
# workflow on that branch by hand with "Run workflow" -- `workflow_dispatch` requires
# write access, so the decision is a maintainer's. A fork PR cannot be dispatched
# directly; fetch its branch into this repository first, which is the review step.
#
# If pull_request is ever re-added, keep `permissions:` read-only, keep matrix values
# in `env:` rather than spliced into `run:`, and leave GH_TOKEN empty for forks.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Read-only, and deliberately so: a pull_request from a same-repository branch runs
# THAT branch's workflow file, so a token with any write scope would be reachable by
# the code under test. `contents: read` covers checkout; `actions: read` is what
# `gh run list` in tests/test-s88-ci-gate.sh needs. Never add write scopes here.
# Fork pull requests get a read-only token and no secrets from GitHub itself.
permissions:
  contents: read
  actions: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # A newer run interrupts an older one, on main included.
  #
  # This was `github.event_name == 'pull_request'`, on the measurement that ten
  # pushes in fifteen minutes left every matrix run but the first "cancelled", so
  # the fleet had no results. That measurement predates the merge: two workflows
  # (`CI` and `Tests (matrix)`) ran on every push and each queued its own sweep, so
  # the queue -- not the concurrency rule -- is what starved the runs. With one
  # workflow, a superseded run has no verdict worth keeping: it answers a question
  # about a commit nobody will ship, at 1,233 jobs a sweep.
  #
  # What replaces the old rule is that the *newest* commit is always evaluated: a
  # run cancelled by a newer commit is not evidence, and the replacement run is.
  cancel-in-progress: true

jobs:
  # The ordering this workflow exists for, asserted BEFORE anything expensive.
  #
  # This replaced `tests/test-s88-ci-gate.sh`, which read the repository's last
  # GitHub Actions run to judge the commit. That worked while two workflows ran on
  # one push -- the matrix ran the test, the gate looked at `CI` -- and became
  # circular the moment they were merged into one: the newest run of the
  # repository IS the matrix, so excluding the current run left the previous
  # commit's suite, and a green commit went red because of history.
  #
  # A workflow cannot judge the run that contains it, but it can judge its own
  # structure. It runs first and takes seconds: a gate that is misconfigured must
  # fail now, not after a two-hour flake check has queued every test job.
  workflow-structure:
    name: "workflow structure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # ---------------------------------------------------------------------
      # The ordering this workflow exists for, asserted where it can be
      # checked offline: the flake check gates every test job.
      #
      # This replaced `tests/test-s88-ci-gate.sh`, which read the repository's
      # last GitHub Actions run to judge the commit. That worked while two
      # workflows ran on one push -- the matrix ran the test, the gate looked at
      # `CI` -- and became circular the moment they were merged into one: the
      # newest run of the repository IS the matrix, so excluding the current run
      # left the previous commit's suite. Its verdict was "the last commit was
      # green", which flips a green commit red because of history.
      #
      # A workflow cannot judge the run that contains it, but it can judge its
      # own structure, and that is the property: flake first, tests behind it.
      # ---------------------------------------------------------------------
      # THE PIN RULES, AS A GATE.
      #
      # These four properties are what kept the cache missing, and every one of them was
      # something a person had to remember:
      #
      #   no absolute rev in an input URL -- `github:owner/repo/<40-hex>` cannot be moved
      #     by `nix flake update` (no branch to advance) nor by a consumer's `follows`
      #     (different graph). Measured: copying the consumer's flake.lock over such a
      #     flake does not move it either -- the URL wins.
      #   no input declared but never used -- it drags a whole graph into every lock that
      #     can reach it, and if it pins a rev, an unmovable one.
      #   every input follows this repository's nixpkgs -- otherwise the pin is
      #     one-directional: the consumer decides what it pulls, and the copy it pulls
      #     pins its own. Measured both ways by pinning one side to an old rev.
      #   every cycle-breaking `follows = ""` still pins nixpkgs -- that node keeps its
      #     own world, and without this it keeps its own nixpkgs and stdenv too.
      #
      # Static, so it costs a second and cannot be defeated by a warm eval cache (which
      # is what makes `nix eval --offline` useless as a detector).
      - name: "Flake inputs are pinned the way the fleet requires"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PIN_CHECK'
          import pathlib, re, sys

          flake = pathlib.Path("flake.nix")
          raw = flake.read_text()
          # A rev quoted in an explanation is documentation, not a pin.
          text = "\n".join(re.sub(r"(?<!\\)#.*$", "", l) for l in raw.splitlines())
          failures = []

          for m in re.finditer(r"github:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/[0-9a-f]{40}", text):
              line = text[: m.start()].count("\n") + 1
              failures.append(
                  f'flake.nix:{line}: absolute rev in an input URL -- {m.group(0)}; use a '
                  f'branch so `nix flake update` can move it and a consumer can follow it'
              )

          urls = list(re.finditer(r'^\s*([A-Za-z0-9_-]+)\.url\s*=\s*"', text, re.M))
          body = re.sub(r'^\s*[A-Za-z0-9_.-]+\.url\s*=\s*"[^"]+"\s*;\s*$', "", text, flags=re.M)
          # SHELL TESTS READ FLAKE INPUTS TOO. The scan only looked at *.nix, so an input
          # read as `flake.inputs.network-labs.outPath` from a bash case counted as dead and
          # a sweep removed it -- which then failed 6 test jobs with "attribute
          # 'network-control-plane-model' missing" (network-renderer-containerlab-linux-backend
          # run 45952823354). The question this check asks is "is the input read anywhere in
          # the repository", and the suite is part of the repository.
          tree = [f for f in pathlib.Path(".").rglob("*.nix") if f.name != "flake.nix"]
          if pathlib.Path("tests").is_dir():
              tree += [f for f in pathlib.Path("tests").rglob("*.sh")]
          for m in urls:
              name = m.group(1)
              line = text[: m.start()].count("\n") + 1
              used = re.search(rf"(?<![A-Za-z0-9_-]){re.escape(name)}(?![A-Za-z0-9_.-])", body)
              if not used and not any(
                  re.search(rf"(?<![A-Za-z0-9_-]){re.escape(name)}(?![A-Za-z0-9_.-])",
                            f.read_text(errors="ignore"))
                  for f in tree
              ):
                  failures.append(
                      f'flake.nix:{line}: input `{name}` is declared but never used -- it adds a '
                      f'whole graph to every lock that reaches it'
                  )
              if name != "nixpkgs" and f'{name}.inputs.nixpkgs.follows = "nixpkgs";' not in text:
                  failures.append(
                      f'flake.nix:{line}: `{name}` does not follow this repository\'s nixpkgs -- '
                      f'add `{name}.inputs.nixpkgs.follows = "nixpkgs";` or the copy it brings '
                      f'pins its own'
                  )

          for m in re.finditer(
              r'^\s*([A-Za-z0-9_-]+)\.inputs\.network-labs\.follows\s*=\s*""\s*;', text, re.M
          ):
              outer = m.group(1)
              if f'{outer}.inputs.network-labs.inputs.nixpkgs.follows = "nixpkgs";' not in text:
                  line = text[: m.start()].count("\n") + 1
                  failures.append(
                      f'flake.nix:{line}: `{outer}.inputs.network-labs.follows = ""` breaks a cycle '
                      f'but brings its own nixpkgs; add '
                      f'`{outer}.inputs.network-labs.inputs.nixpkgs.follows = "nixpkgs";`'
                  )

          if failures:
              print("FAIL PIN-RULES: the flake does not pin the way the fleet requires", file=sys.stderr)
              for f in failures:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)
          print("PASS PIN-RULES: no absolute revs, no dead inputs, every input follows nixpkgs")
          PIN_CHECK

      # OBSOLETE FIXTURES ARE REPORTED, NOT FAILED, AND NOT FIXED HERE.
      #
      # A fixture that encodes a superseded contract (relations selecting exits with
      # `uplinks`, allow relations without `returnBehavior`, an external named but not
      # declared as an overlay) makes every test that consumes it stale. That has happened
      # twice in network-labs -- 4ffce424 removed the tri-site fixtures, 622c96b3 removed
      # twenty more example directories -- and both times the consumers' tests were marked
      # retired instead of the fixture being migrated.
      #
      # Migrating is content work with a modelling question per fixture, and the fixtures
      # are network-labs' to own. So this reports: the run gets an annotation naming the
      # fixture, the rule and the owning layer, and the job stays green. The debt is
      # visible on every push without a person having to look for it.
      - name: "Report fixtures on a superseded contract"
        if: hashFiles('tests/check-obsolete-fixtures.sh') != ''
        shell: bash
        run: bash tests/check-obsolete-fixtures.sh

      - name: "The flake check gates every test job"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import pathlib, re, sys

          workflow = pathlib.Path(".github/workflows/tests-matrix.yml")
          text = workflow.read_text()
          failures = []

          # --- 1. no second workflow racing this one on push -------------------------
          racing = sorted(
              p.name
              for p in pathlib.Path(".github/workflows").glob("*.yml")
              if p.name != workflow.name and re.search(r"^\s*push:", p.read_text(), re.M)
          )
          if racing:
              failures.append(f"workflow(s) also triggered by push: {', '.join(racing)}")

          # --- 2. one job per test, gated: flake-check -> list -> test ---------------
          # Line parse, not a regex over the file. A pattern like
          #   (?:    .*\n|      .*\n)*?    needs: X
          # is ambiguous at every line boundary and backtracks exponentially when it fails
          # to match; on a 400-line file that is minutes, not a check.
          jobs = {}
          current = None
          for line in text.splitlines():
              stripped = line.strip()
              if line.startswith("  ") and not line.startswith("   ") and stripped.endswith(":") and not stripped.startswith("#"):
                  current = stripped[:-1]
                  jobs[current] = {"needs": []}
              elif current and line.startswith("    needs:"):
                  value = line.split(":", 1)[1].strip()
                  jobs[current]["needs"] = [n.strip() for n in value.strip("[]").split(",") if n.strip()]
              elif current and line.startswith("    continue-on-error:"):
                  jobs[current]["continue-on-error"] = line.split(":", 1)[1].strip().lower() == "true"

          if "flake-check" not in jobs:
              failures.append("no flake-check job in this workflow")
          if "flake-check" not in jobs.get("list", {}).get("needs", []):
              failures.append("list does not declare `needs: flake-check`")
          if "flake-drift" not in jobs.get("list", {}).get("needs", []):
              failures.append("list does not declare `needs: flake-drift` (drift is a gate)")
          for gate in ("flake-check", "flake-drift"):
              if jobs.get(gate, {}).get("continue-on-error"):
                  failures.append(f"{gate} is `continue-on-error`: it cannot gate `list`")
          if "list" not in jobs.get("test", {}).get("needs", []):
              failures.append("test does not declare `needs: list`")

          if failures:
              print("FAIL FLAKE-GATE: the workflow does not gate tests behind the flake check", file=sys.stderr)
              for f in failures:
                  print(f"  - {f}", file=sys.stderr)
              print("  A green badge must mean the tests ran, not that the flake evaluates.", file=sys.stderr)
              sys.exit(1)
          print("PASS FLAKE-GATE: one workflow; flake-check + flake-drift -> list -> test")
          CHECK


  flake-check:
    name: "nix flake check"
    needs: workflow-structure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6
      # 3 MB single binary, no daemon, no installer script. Measured against
      # cachix/install-nix-action: that one downloads the 26 MB Nix tarball and runs
      # the multi-user installer (users, systemd units, /etc/nix) in every job; the
      # suites need `nix eval` and a store, not a daemon.
      # Everything Nix needs, cached on GitHub's side and keyed by the lock.
      #
      # /nix holds the installed Nix, every store path the suite has ever needed, and
      # ~/.cache/nix holds the evaluated flake inputs. Keyed on flake.lock, so a job
      # for the same pins restores a warm tree instead of installing Nix and
      # resolving nixpkgs again. First job after a lock change pays; the rest do not.
      # /nix must exist before the cache is unpacked: the archive's members are
      # absolute store paths and tar cannot create the missing parent, so a restore
      # into a runner with no /nix fails member by member ("Cannot open: No such file
      # or directory") and the job downloads everything anyway.
      - name: "Prepare /nix for the cache"
        shell: bash
        run: |
          sudo mkdir -p /nix
          sudo chown -R "$(id -u):$(id -g)" /nix

      # The tools this job installs, cached apart from /nix: ripgrep is 2.5 MB and
      # identical for every job, and a cache hit turns its download into a no-op.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: toolcache
        with:
          path: /home/runner/.local/bin
          key: tools-${{ runner.os }}-rg-14.1.1

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: nixcache
        with:
          path: |
            /nix
            /home/runner/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-eval-v1
          restore-keys: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - if: steps.nixcache.outputs.cache-hit != 'true'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      # On a hit there was no installer to run, so `nix` is on disk but neither on
      # PATH nor reachable through the profile symlink the installer creates in
      # $HOME: nix-quick-install appends `$HOME/.nix-profile/bin`, and that symlink
      # lives outside /nix, so the cache does not carry it.
      - if: steps.nixcache.outputs.cache-hit == 'true'
        name: "Put the restored Nix on PATH"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/nix/var/nix/profiles/per-user"
          ln -sfn "/nix/var/nix/profiles/per-user/${USER}" "${HOME}/.nix-profile"
          # /etc/nix/nix.conf comes from the installer, which did not run on a hit.
          # Without it every nix command dies with "experimental Nix feature
          # 'nix-command' is disabled", which is what a restored cache produced.
          if [[ ! -f /etc/nix/nix.conf ]]; then
            sudo mkdir -p /etc/nix
            printf 'experimental-features = nix-command flakes\n' | sudo tee /etc/nix/nix.conf >/dev/null
          fi
          for candidate in "${HOME}/.nix-profile/bin" \
                           "/nix/var/nix/profiles/default/bin" \
                           "/nix/var/nix/profiles/per-user/${USER}/bin"; do
            [[ -x "${candidate}/nix" ]] && printf '%s\n' "${candidate}" >> "${GITHUB_PATH}"
          done
          if ! command -v nix >/dev/null; then
            # Last resort: the store is what was restored, so the binary is in it.
            store_nix="$(find /nix/store -maxdepth 3 -name nix -type f -perm -u+x 2>/dev/null | head -1)"
            if [[ -n "${store_nix}" ]]; then
              printf '%s\n' "$(dirname "${store_nix}")" >> "${GITHUB_PATH}"
            fi
          fi

      - name: "Nix is available"
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nix >/dev/null; then
            echo "nix was restored but is not on PATH; /nix/var/nix/profiles:" >&2
            ls -la /nix/var/nix/profiles /nix/var/nix/profiles/per-user 2>&1 | sed 's/^/  /' >&2
            exit 1
          fi
          nix --version

      # The pins the commit SHIPS. This is the blocking gate: a commit that does not
      # evaluate with its own lock is not a commit whose tests mean anything.
      - name: "Check flake outputs (committed pins)"
        run: nix flake check --no-build -L --show-trace

  # Drift is a GATE.
  #
  # This job updates every input and evaluates against the fleet as it is on main
  # right now. A repository pinned to something main can no longer build is not
  # green: testing the commit under review while silently pinned to a dead input
  # just reports on code nobody can consume. When it was a report it stayed red for
  # as long as anyone ignored it, which is how `network-realization-schema`
  # ee36b1ba833171985fccb59f8ab6c0e5525f3acc -- an ORPHANED commit, not an ancestor of
  # schema main, predating the canonical bundle field -- survived in five
  # repositories at once.
  #
  # The gate is only useful with the pins it measures actually fixed: `nix flake
  # update` across the fleet, not a hand-edited lock.
  flake-drift:
    name: "flake drift (today's pins)"
    needs: workflow-structure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v6
      # 3 MB single binary, no daemon, no installer script. Measured against
      # cachix/install-nix-action: that one downloads the 26 MB Nix tarball and runs
      # the multi-user installer (users, systemd units, /etc/nix) in every job; the
      # suites need `nix eval` and a store, not a daemon.
      # Everything Nix needs, cached on GitHub's side and keyed by the lock.
      #
      # /nix holds the installed Nix, every store path the suite has ever needed, and
      # ~/.cache/nix holds the evaluated flake inputs. Keyed on flake.lock, so a job
      # for the same pins restores a warm tree instead of installing Nix and
      # resolving nixpkgs again. First job after a lock change pays; the rest do not.
      # /nix must exist before the cache is unpacked: the archive's members are
      # absolute store paths and tar cannot create the missing parent, so a restore
      # into a runner with no /nix fails member by member ("Cannot open: No such file
      # or directory") and the job downloads everything anyway.
      - name: "Prepare /nix for the cache"
        shell: bash
        run: |
          sudo mkdir -p /nix
          sudo chown -R "$(id -u):$(id -g)" /nix

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: nixcache
        with:
          path: |
            /nix
            /home/runner/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-eval-v1
          restore-keys: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - if: steps.nixcache.outputs.cache-hit != 'true'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      # On a hit there was no installer to run, so `nix` is on disk but neither on
      # PATH nor reachable through the profile symlink the installer creates in
      # $HOME: nix-quick-install appends `$HOME/.nix-profile/bin`, and that symlink
      # lives outside /nix, so the cache does not carry it.
      - if: steps.nixcache.outputs.cache-hit == 'true'
        name: "Put the restored Nix on PATH"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/nix/var/nix/profiles/per-user"
          ln -sfn "/nix/var/nix/profiles/per-user/${USER}" "${HOME}/.nix-profile"
          # /etc/nix/nix.conf comes from the installer, which did not run on a hit.
          # Without it every nix command dies with "experimental Nix feature
          # 'nix-command' is disabled", which is what a restored cache produced.
          if [[ ! -f /etc/nix/nix.conf ]]; then
            sudo mkdir -p /etc/nix
            printf 'experimental-features = nix-command flakes\n' | sudo tee /etc/nix/nix.conf >/dev/null
          fi
          for candidate in "${HOME}/.nix-profile/bin" \
                           "/nix/var/nix/profiles/default/bin" \
                           "/nix/var/nix/profiles/per-user/${USER}/bin"; do
            [[ -x "${candidate}/nix" ]] && printf '%s\n' "${candidate}" >> "${GITHUB_PATH}"
          done
          if ! command -v nix >/dev/null; then
            # Last resort: the store is what was restored, so the binary is in it.
            store_nix="$(find /nix/store -maxdepth 3 -name nix -type f -perm -u+x 2>/dev/null | head -1)"
            if [[ -n "${store_nix}" ]]; then
              printf '%s\n' "$(dirname "${store_nix}")" >> "${GITHUB_PATH}"
            fi
          fi

      - name: "Nix is available"
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nix >/dev/null; then
            echo "nix was restored but is not on PATH; /nix/var/nix/profiles:" >&2
            ls -la /nix/var/nix/profiles /nix/var/nix/profiles/per-user 2>&1 | sed 's/^/  /' >&2
            exit 1
          fi
          nix --version
      - name: "Refresh the pins"
        shell: bash
        run: |
          set -euo pipefail
          nix flake update
          git --no-pager diff --stat -- flake.lock || true
      - name: "Evaluate against today's fleet"
        run: nix flake check --no-build -L --show-trace

  list:
    name: "list tests"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    # Discovery is seconds; the build-closure warm is not. 60 keeps a cold cache from
    # turning discovery into a timeout.
    # BOTH flake jobs, in order, before a single test is scheduled: the gate that
    # evaluates the committed pins and the drift report that evaluates today's. They
    # were parallel because drift is `continue-on-error` -- which controls whether a
    # FAILURE stops dependants, not whether they WAIT. A test run that starts while
    # the drift check is still resolving is a test run against two different input
    # sets, and that is the thing this whole workflow exists to prevent.
    needs: [flake-check, flake-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      shards: ${{ steps.discover.outputs.shards }}
      shard_size: ${{ steps.discover.outputs.shard_size }}
    steps:
      - uses: actions/checkout@v6

      # /nix must exist before the cache is unpacked: the archive members are absolute
      # store paths and tar will not create the missing parent.
      #
      # Two keys, because a cache entry is immutable and the first writer wins: the
      # gates write `-eval-v1` (evaluation inputs only, `--no-build`) and `list` alone
      # writes `-apps-v2` (that store plus the build closure). With one shared key the
      # gate saved first, `list`'s save was skipped, and every test job fetched git's
      # 15 MiB doc output again.
      - name: "Prepare /nix for the cache"
        shell: bash
        run: |
          sudo mkdir -p /nix
          sudo chown -R "$(id -u):$(id -g)" /nix
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: nixcache
        with:
          path: |
            /nix
            /home/runner/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-apps-v2
          restore-keys: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-
      - if: steps.nixcache.outputs.cache-hit != 'true'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - if: steps.nixcache.outputs.cache-hit == 'true'
        name: "Put the restored Nix on PATH"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/nix/var/nix/profiles/per-user"
          ln -sfn "/nix/var/nix/profiles/per-user/${USER}" "${HOME}/.nix-profile"
          # /etc/nix/nix.conf comes from the installer, which did not run on a hit.
          # Without it every nix command dies with "experimental Nix feature
          # 'nix-command' is disabled", which is what a restored cache produced.
          if [[ ! -f /etc/nix/nix.conf ]]; then
            sudo mkdir -p /etc/nix
            printf 'experimental-features = nix-command flakes\n' | sudo tee /etc/nix/nix.conf >/dev/null
          fi
          for candidate in "${HOME}/.nix-profile/bin" \
                           "/nix/var/nix/profiles/default/bin" \
                           "/nix/var/nix/profiles/per-user/${USER}/bin"; do
            [[ -x "${candidate}/nix" ]] && printf '%s\n' "${candidate}" >> "${GITHUB_PATH}"
          done
          command -v nix >/dev/null || {
            store_nix="$(find /nix/store -maxdepth 3 -name nix -type f -perm -u+x 2>/dev/null | head -1)"
            [[ -n "${store_nix}" ]] && printf '%s\n' "$(dirname "${store_nix}")" >> "${GITHUB_PATH}"
          }
      - name: "Nix is available"
        shell: bash
        run: |
          set -euo pipefail
          command -v nix >/dev/null || { echo "nix not on PATH" >&2; ls -la /nix/var/nix/profiles 2>&1 | sed 's/^/  /' >&2; exit 1; }
          nix --version

      - id: discover
        name: "Discover entrypoints"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/lib/discover-tests.sh ]]; then
            # shellcheck source=/dev/null
            source scripts/lib/discover-tests.sh
            mapfile -t names < <(discover_tests "$PWD")
          else
            # A repository without the contract falls back to the naming rule the
            # contract encodes, so this workflow still works during a migration.
            mapfile -t names < <(
              find tests -maxdepth 1 -type f \
                \( -name 'test-*.sh' -o -name 'test_*.py' \
                   -o -regex '.*/FS-[0-9]+-HDS-[0-9]+-SDS-[0-9]+-\(SMS\|SIT\)-[0-9a-z][a-z0-9-]*\(-[a-z0-9-]+\)?\.\(sh\|py\)' \) \
                ! -name 'test.sh' -printf '%f\n' | LC_ALL=C sort
            )
          fi
          count="${#names[@]}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if ((count == 0)); then
            echo 'matrix={"test":[]}' >> "$GITHUB_OUTPUT"
            echo "no entrypoints discovered; the matrix will be empty"
            exit 0
          fi
          # GITHUB CAPS A MATRIX AT 256 JOBS. THE CAP IS ON THE MATRIX, NOT ON THE
          # PARALLELISM WITHIN IT.
          #
          # Above that the `test` job is not created at all -- measured: network-labs
          # discovers 486 entrypoints and its run produced four jobs and no tests, with
          # `list` reporting success. Sharding is the only way to run a suite that size,
          # so it is used exactly when it is needed and not before: one job per test
          # below the cap (a failure named after the test), shards above it (a failure
          # named "shard N", which is worse but is the only thing that runs).
          max_jobs="${TEST_MAX_JOBS:-250}"
          shard_size="${TEST_SHARD_SIZE:-}"
          if (( count <= max_jobs )); then
            json="$(printf '%s\n' "${names[@]}" | python3 -c 'import json,sys; print(json.dumps({"test":[l.strip() for l in sys.stdin if l.strip()]}))')"
            echo "shards=0" >> "$GITHUB_OUTPUT"
            echo "shard_size=1" >> "$GITHUB_OUTPUT"
            echo "matrix=${json}" >> "$GITHUB_OUTPUT"
            echo "discovered ${count} entrypoint(s): one job per test"
            exit 0
          fi
          if [[ -z "${shard_size}" ]]; then
            shard_size=$(( (count + max_jobs - 1) / max_jobs ))
          fi
          shards=$(( (count + shard_size - 1) / shard_size ))
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          echo "shard_size=${shard_size}" >> "$GITHUB_OUTPUT"
          json="$(python3 -c "import json;print(json.dumps({'shard':list(range(${shards}))}))")"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "discovered ${count} entrypoint(s): ${shards} shard(s) of ${shard_size}, because ${count} exceeds the ${max_jobs}-job matrix cap"


      # Warm the BUILD closure, not just the evaluation inputs, then hand it to the
      # test jobs as an artifact: a cache entry is immutable and per-lock, so it can
      # never be extended, and a test that builds its own derivation still fetched 145
      # paths / 111 MiB even with the warmed cache restored.
      - name: "Warm the build closure"
        shell: bash
        run: |
          set -uo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          # NOT EVERY REPOSITORY DECLARES APPS.
          #
          # Four of the twelve produce data files rather than programs
          # (realization-model, realization-schema, access-endpoint-nixos, wireguard).
          # The original version of this step asked for `.#apps.<sys>` unconditionally
          # and failed the whole `list` job when the attribute was missing:
          #
          #   error: flake '...' does not provide attribute 'packages...apps...'
          #   ::error::no apps in .#apps.x86_64-linux; the test jobs would substitute everything
          #
          # which meant those repositories ran no tests at all. "No apps" is a fact
          # about the repository, not a cache failure.
          mapfile -t apps < <(nix eval --json --impure "path:${PWD}#apps.${system}" \
            --apply builtins.attrNames 2>/dev/null | jq -r '.[]?' 2>/dev/null || true)
          if (( ${#apps[@]} == 0 )); then
            echo "PASS WARM-APPS: this repository declares no apps; nothing to warm"
            : > "${RUNNER_TEMP}/app-outs.txt"
            exit 0
          fi
          # An app is `{ type = "app"; program = <string with store context>; }`, and
          # neither spelling of it is a derivation. Both measured in this job:
          #
          #   nix build ".#apps.${system}.${app}"
          #     error: expected flake output attribute 'apps.x86_64-linux.compile' to be
          #     a derivation or path but found a set: { type = "app"; program = ... }
          #
          #   nix build ".#apps.${system}.${app}.program"
          #     error: string '/nix/store/...-app/bin/app' has context with the output
          #     'out' from derivation '/nix/store/...-app.drv', but the string is not the
          #     right placeholder for this derivation output
          #
          # The derivation is the context of that string; `builtins.getContext` reads it.
          # Getting this wrong is how run 45521299422 lost every test job: the warm step
          # built nothing, the export step found no derivations, the upload step warned
          # instead of failing, and all 98 test jobs died in actions/download-artifact
          # with "Artifact not found for name: nix-store" before running a single test.
          # So: no `|| echo`, no `|| continue`. If an app cannot be built, this job is
          # red and says which one.
          : > "${RUNNER_TEMP}/app-drvs.txt"
          for app in "${apps[@]}"; do
            echo "::group::warm app ${app}"
            # `path:$PWD`, not `$PWD`: the two produce different derivations, measured in
            # this series, and the tests resolve `path:${repo_root}#...`. A warm that uses
            # the bare form builds something no test will ever ask for.
            #
            # `builtins.getFlake "path:$PWD"` reads the files as a plain directory and
            # sets no revision, while the tests run `nix run "$ROOT#compile"` on a git
            # checkout. `mkEvalApp` bakes `self.sourceInfo` into the app, so the two
            # spellings produce DIFFERENT derivations -- measured: the warm job built
            # q98iidds...-app.drv and the test then tried to build x0miqdjk...-app.drv
            # from source (run 45529713443). Warming the wrong derivation is the same
            # outcome as not warming: the test substitutes the whole toolchain.
            #
            # So the warm step asks for the app the same way a test does: through the
            # flake reference `.#<app>`, from the repository root.
            nix eval --raw "path:${PWD}#apps.${system}.${app}.program" \
              --apply 'p: builtins.head (builtins.filter (n: builtins.match ".*\.drv" n != null) (builtins.attrNames (builtins.getContext p)))' \
              > "${RUNNER_TEMP}/app-drv.txt" || {
              echo "::error::${app}: its program is not produced by a derivation"
              exit 1
            }
            drv="$(cat "${RUNNER_TEMP}/app-drv.txt")"
            echo "${app} -> ${drv}"
            # --print-out-paths is not decoration. `nix-store -qR <drv>` lists the .drv
            # files and NOT their outputs, so exporting from drvs alone shipped a store
            # with every derivation and almost none of the things they produce: measured
            # in run 45527750114, where the test jobs were handed 1896 paths and then
            # tried to build bash-5.3 and Nix 2.31.3 from source. The output paths are
            # what the tests execute, and they are what has to travel.
            # `nix build --print-out-paths <drv>` is NOT the tool: given a .drv it prints
            # the .drv back (measured), so app-outs.txt filled with derivations again and
            # the test jobs rebuilt bash from source a second time. `nix-store -r` builds
            # the derivation and prints the paths it produces, which is what has to travel.
            nix-store -r "${drv}" > "${RUNNER_TEMP}/app-out.txt" 2>"${RUNNER_TEMP}/app-err.txt" || {
              cat "${RUNNER_TEMP}/app-err.txt" >&2
              echo "::error::${app} (${drv}) failed to build; the test jobs would substitute it"
              exit 1
            }
            echo "  outputs: $(tr '\n' ' ' < "${RUNNER_TEMP}/app-out.txt")"
            echo "  sourceInfo: $(nix eval --impure --raw --expr "let f = builtins.getFlake \"path:${PWD}\"; in builtins.toJSON (f.sourceInfo or {})" 2>/dev/null)"
            echo "  worktree: $(git status --porcelain --untracked-files=all | wc -l) changed path(s)"
            printf '%s\n' "${drv}" >> "${RUNNER_TEMP}/app-drvs.txt"
            cat "${RUNNER_TEMP}/app-out.txt" >> "${RUNNER_TEMP}/app-outs.txt"
            echo "::endgroup::"
          done

      # WARM THIS REPOSITORY'S OWN FLAKE INPUTS. NOBODY ELSE'S.
      #
      # This step used to scan `../*/flake.lock` -- every sibling repository's lock --
      # and then prefetch and BUILD every github pin found across the whole fleet. So a
      # run of network-compiler warmed network-labs, the renderers, the forwarding and
      # control-plane models and the schema: minutes of building other repositories'
      # closures, for a test that only ever evaluates THIS one.
      #
      # That was mine, added while chasing a single provenance case, and never scoped.
      #
      # `nix flake archive "path:$PWD"` is the honest bound: it materialises the inputs
      # THIS repository's lock names, which is exactly what evaluating this flake can
      # reach when the store is closed. If a particular test needs an input this lock
      # does not pin, that is a fact about the test and it will say so by name.
      - name: "Warm this repository's own flake inputs"
        shell: bash
        run: |
          set -uo pipefail
          if nix flake archive --json "path:${PWD}" > "${RUNNER_TEMP}/flake-archive.json" 2>"${RUNNER_TEMP}/archive.err"; then
            count="$(jq -r '[.. | .path? // empty] | unique | length' "${RUNNER_TEMP}/flake-archive.json" 2>/dev/null || echo 0)"
            echo "PASS WARM-INPUTS: ${count} input source(s) from this repository's lock"
            jq -r '[.. | .path? // empty] | unique | .[]' "${RUNNER_TEMP}/flake-archive.json" \
              >> "${RUNNER_TEMP}/app-outs.txt" 2>/dev/null || true
          else
            echo "::warning::this repository's inputs could not be archived"
            sed 's/^/  /' "${RUNNER_TEMP}/archive.err" >&2 || true
          fi

      # PREPARE THE CACHE: THE TEST ENVIRONMENT, DECLARED IN flake.nix.
      #
      # `nix build .#devShells.<sys>.default` builds only the shell MARKER. What
      # `nix develop` actually constructs -- and what the test steps use as their shell
      # -- is a separate `<name>-env` derivation. Warming the marker and not the env is
      # how a run ends up bootstrapping gcc inside a step that should be well-cached.
      #
      # `nix print-dev-env` forces exactly that derivation, so it is what runs here.
      # This step is deliberately SEPARATE from the tests: if it fails, the cause is the
      # cache, and nothing downstream has to be read to know that.
      - name: "Prepare the cache: the declared test environment"
        id: prepare_env
        shell: bash
        run: |
          set -uo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if nix print-dev-env ".#devShells.${system}.default" > "${RUNNER_TEMP}/dev-env.txt" 2>"${RUNNER_TEMP}/dev-env.err"; then
            shell_path="$(grep -m1 "^PATH='" "${RUNNER_TEMP}/dev-env.txt" | sed "s/^PATH='//; s/'$//")"
            echo "PASS PREPARE-ENV: the devShell environment is built"
            printf '  PATH entries: %s\n' "$(printf '%s' "${shell_path}" | tr ':' '\n' | grep -c . || true)"
            printf '%s\n' "${shell_path}" > "${RUNNER_TEMP}/dev-shell-path.txt"
            # The env derivation is what has to travel: the shell marker alone does not
            # contain it. Its closure is every tool the suites run.
            env_drv="$(nix eval --raw --impure ".#devShells.${system}.default.drvPath" 2>/dev/null)" || env_drv=""
            if [[ -n "${env_drv}" ]]; then
              # A mkShell output is a MARKER, not a valid store path: asking for its
              # outputs and exporting them fails with "path ... is not valid". Only
              # outputs that actually exist are recorded; the shell's tools travel
              # through the PATH directories immediately below.
              while read -r o; do
                [[ -n "${o}" ]] || continue
                nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
              done < <(nix-store -q --outputs "${env_drv}" 2>/dev/null || true)
              echo "  env derivation: ${env_drv}"
            fi
            for d in ${shell_path//:/ }; do
              [[ -d "${d}/.." ]] && printf '%s\n' "$(dirname "${d}")" >> "${RUNNER_TEMP}/app-outs.txt"
            done
          else
            echo "::error::CACHE: .#devShells.${system}.default could not be built"
            sed 's/^/  /' "${RUNNER_TEMP}/dev-env.err" >&2 || true
            exit 1
          fi

          # AND THE STDENV OF EVERY INPUT THAT HAS ITS OWN nixpkgs.
          #
          # A cross-repository test evaluates a SIBLING's flake, and that sibling pins
          # its own nixpkgs. Its stdenv is therefore not the one warmed above:
          #
          #   test-fs180-fs270-selector-relation-authority.sh
          #     archived.inputs."network-compiler".path  ->  evaluated
          #     builds ...-bash-5.3.tar.gz  (this repo's pin has 5.3p9)
          #
          # ONE stdenv per input, not every app: the expensive version of this was
          # removed earlier for taking 19 minutes. Bounded by count and by wall clock,
          # and a failure is a warning -- the test that needs it will say so by name.
          stdenv_budget="${STDENV_BUDGET_SECONDS:-300}"
          stdenv_done=0
          stdenv_seen=""
          # THIS REPOSITORY'S OWN STDENV, which every input is required to share.
          #
          # A bounding wall clock cannot save a step from one build that runs longer than
          # the budget: the check happens BEFORE each input, so a single foreign stdenv
          # builds for as long as it likes. Measured in network-control-plane-model run
          # 45944911707: this step ran 05:19:30 -> 06:19:09, exactly the 60-minute job
          # timeout, because an input pinned a 2024 nixpkgs (ac56c456) and Nix rebuilt
          # that whole bootstrap toolchain from source.
          #
          # After the pin work every repository resolves ONE nixpkgs, so an input stdenv
          # that differs is a foreign pin -- the very thing the pin gate forbids. It is
          # reported, not built.
          root_drv="$(nix eval --raw --impure \
            --expr "let f = builtins.getFlake \"path:${PWD}\"; in f.inputs.nixpkgs.legacyPackages.\"${system}\".stdenv.drvPath" 2>/dev/null || true)"
          # The count is a safety valve, not the real guard: the wall-clock budget above
          # is what keeps this bounded. A graph this size has more distinct nixpkgs than
          # a small constant, and capping at 4/6 left the later ones cold -- which showed
          # up as a 1579-derivation bootstrap in a cross-repository test that runs a
          # SIBLING's app (`nix run path:${compiler_path}#compile`).
          stdenv_max="${STDENV_MAX_INPUTS:-20}"
          if [[ -s "${RUNNER_TEMP}/flake-archive.json" ]]; then
            while read -r input_path; do
              [[ -d "${input_path}" ]] || continue
              [[ -f "${input_path}/flake.nix" ]] || continue
              (( stdenv_done < stdenv_max )) || { echo "  input stdenv budget reached"; break; }
              (( SECONDS < stdenv_budget )) || { echo "  input stdenv time budget reached"; break; }
              # Three spellings, because "an input" means three different things here:
              #
              #   a flake that pins a nixpkgs   -> its `inputs.nixpkgs`
              #   nixpkgs ITSELF (a nixpkgs input has no `inputs.nixpkgs`)
              #                                 -> its own `legacyPackages`
              #   a flake exposing packages     -> `packages`
              #
              # network-compiler's flake exposes apps and lib and no packages at all, so
              # only the first form resolves; `nixpkgs-network` is a nixpkgs tree, so only
              # the second does. Missing the second is why a 1579-derivation bootstrap
              # survived even with three stdenvs already realised.
              # `--expr`, or `nix eval` treats the string as a FILE and fails with
              # "getting status of .../let f = builtins.getFlake ...: No such file".
              input_drv="$(nix eval --impure --raw --expr \
                "let f = builtins.getFlake \"path:${input_path}\"; in f.inputs.nixpkgs.legacyPackages.\"${system}\".stdenv.drvPath" 2>/dev/null \
                || nix eval --raw --impure "path:${input_path}#legacyPackages.${system}.stdenv.drvPath" 2>/dev/null \
                || nix eval --raw --impure "path:${input_path}#packages.${system}.stdenv.drvPath" 2>/dev/null \
                || true)"
              [[ -n "${input_drv}" ]] || continue
              if [[ -n "${root_drv}" && "${input_drv}" != "${root_drv}" ]]; then
                echo "::warning::$(basename "${input_path}") pins a different nixpkgs (stdenv $(basename "${input_drv}" .drv)); not building it -- the pin rules require one nixpkgs"
                continue
              fi
              # DEDUPE BY DERIVATION. Most inputs pin the same nixpkgs, so their stdenv
              # is the same store path; without this the budget was spent re-realising
              # one derivation and the next distinct input never got a turn.
              case " ${stdenv_seen} " in
                *" ${input_drv} "*) continue ;;
              esac
              stdenv_seen="${stdenv_seen} ${input_drv}"
              if nix-store -r "${input_drv}" > /dev/null 2>&1; then
                while read -r o; do
                  [[ -n "${o}" ]] || continue
                  nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
                done < <(nix-store -q --outputs "${input_drv}" 2>/dev/null || true)
                printf '  input stdenv realised: %s -> %s\n' "$(basename "${input_path}")" "$(basename "${input_drv}")"
                stdenv_done=$((stdenv_done + 1))
              fi
            done < <(jq -r '[.. | .path? // empty] | unique | .[]' "${RUNNER_TEMP}/flake-archive.json" 2>/dev/null || true)
          fi
          echo "PASS CACHE-STDENV-INPUTS: ${stdenv_done} input stdenv(s) realised"

          # THE APPS OF THIS REPOSITORY'S OWN INPUTS, TOO.
          #
          # A cross-repository case archives this repository's inputs and then RUNS a
          # sibling's app:
          #
          #   nix flake archive --json "path:${repo_root}"        # -> compilerPath
          #   nix run "path:${compilerPath}#compile" -- ...
          #
          # The sibling's compile app was never warmed, so the closed store built it --
          # 1534 derivations, measured in network-forwarding-model
          # FS-180-HDS-010-SDS-010-SMS-010 after every stdenv was correctly in place.
          #
          # Bounded to the inputs of THIS lock (not every sibling's lock, which is what
          # made this explode to 19 minutes once) and by the same wall clock, and each
          # app's outputs are recorded, not its .drv.
          # ITS OWN CLOCK, not the stdenv one: by the time the stdenvs are done the
          # shared budget was already spent, so the app loop had no time and stopped
          # before reaching the input the tests actually run. Measured: six apps realised
          # from the first input, and network-compiler's `compile` -- the one a case
          # invokes -- never reached.
          apps_started=${SECONDS}
          apps_budget="${APPS_BUDGET_SECONDS:-420}"
          apps_done=0
          apps_max="${APPS_MAX_INPUTS:-24}"
          if [[ -s "${RUNNER_TEMP}/flake-archive.json" ]]; then
            while read -r input_path; do
              [[ -d "${input_path}" ]] || continue
              [[ -f "${input_path}/flake.nix" ]] || continue
              (( apps_done < apps_max )) || { echo "  input app budget reached"; break; }
              (( SECONDS - apps_started < apps_budget )) || { echo "  input app time budget reached"; break; }
              while read -r in_app; do
                [[ -n "${in_app}" ]] || continue
                in_drv="$(nix eval --impure --raw "path:${input_path}#apps.${system}.${in_app}.program" \
                  --apply 'p: builtins.head (builtins.filter (n: builtins.match ".*\\.drv" n != null) (builtins.attrNames (builtins.getContext p)))' 2>/dev/null)" || continue
                if nix-store -r "${in_drv}" > /dev/null 2>&1; then
                  while read -r o; do
                    [[ -n "${o}" ]] || continue
                    nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
                  done < <(nix-store -q --outputs "${in_drv}" 2>/dev/null || true)
                  printf '  input app realised: %s %s\n' "$(basename "${input_path}")" "${in_app}"
                  apps_done=$((apps_done + 1))
                fi
              done < <(nix eval --json --impure "path:${input_path}#apps.${system}" \
                         --apply builtins.attrNames 2>/dev/null | jq -r '.[]?' 2>/dev/null || true)
            done < <(jq -r '[.. | .path? // empty] | unique | .[]' "${RUNNER_TEMP}/flake-archive.json" 2>/dev/null || true)
          fi
          echo "PASS CACHE-INPUT-APPS: ${apps_done} input app(s) realised"

          # PACKAGES THE SUITES ASK FOR BY ATTRIBUTE: `nix shell ... nixpkgs#yq-go`.
          #
          # A case can pull a package straight out of the pinned nixpkgs rather than
          # from the devShell or an app:
          #
          #   nix shell --inputs-from "${repo_root}" nixpkgs#yq-go --command yq ...
          #
          # Nothing warms those, so with the store closed the whole build happens in the
          # test -- measured in network-renderer-containerlab-linux-backend
          # FS-270-HDS-010-SDS-010-SMS-020, which built curl, libssh2 and a CVE patch to
          # get yq.
          #
          # The list is READ FROM THE TESTS, not hardcoded, so a case that starts using
          # another attribute is covered without touching this file.
          # BOTH SPELLINGS. A case can ask for a package as
          #
          #   nix shell ... nixpkgs#yq-go
          #   nix build --expr '... .legacyPackages.${builtins.currentSystem}.radvd'
          #
          # and the second one is what network-renderer-nixos
          # FS-310-HDS-010-SDS-010-SMS-110 uses (measured: 488 derivations to obtain
          # radvd). Non-attribute
          # fragments come out of this too -- `${system}`, `currentSystem}` -- and are
          # skipped when their evaluation fails, which costs one nix eval each.
          #
          # THE RENDERER'S GENERATED SCRIPTS ARE A THIRD CLASS, and they are not
          # named in the tests. A test that reads
          #
          #   builtins.readFile cfg.systemd.services.<name>.serviceConfig.ExecStart
          #
          # forces `pkgs.writeShellScript` to build, and that script's body names
          # ${pkgs.iproute2}/bin/ip, ${pkgs.python3Minimal}/bin/python3 and
          # ${pkgs.coreutils}/bin/tr. When none of those is in the runner's store the
          # whole build happens inside the namespace, where it cannot fetch, and the
          # test dies with
          #
          #   error: Cannot build '/nix/store/...-s88-delegated-prefix-route-core-isp-3.drv'.
          #   Reason: 1 dependency failed.
          #
          # measured in run 46084235343 on test-runtime-underlay-endpoint-source-routes
          # and test-overlay-core-local-hostile-return-routes. The closure is small
          # (40 paths for the s88 route script) but it contains curl, krb5 and
          # python3-minimal, so nothing about it is free. They are warmed by name
          # because a grep over `tests/` cannot see them: the references live in
          # s88/, in the module that writes the script.
          mapfile -t shell_attrs < <(
            {
              grep -rhoE 'nixpkgs#[A-Za-z0-9._-]+' tests 2>/dev/null | sed 's/^nixpkgs#//'
              grep -rhoE 'legacyPackages\.[A-Za-z0-9.${}]+' tests 2>/dev/null | sed 's/.*\.//'
              # Renderer-generated script toolchain (see the note above).
              printf '%s\n' bash coreutils iproute2 python3Minimal
            } | grep -vE '^(\.\.\.|currentSystem\}?|withPackages|system\}?|x86.*|path)$' | sort -u || true)
          shell_done=0
          for attr in "${shell_attrs[@]}"; do
            (( SECONDS - apps_started < apps_budget )) || { echo "  nixpkgs# budget reached"; break; }
            # `#inputs.nixpkgs...` is not a flake output attribute path; the input has
            # to be reached through `builtins.getFlake`, as everywhere else here.
            pkg_drv="$(nix eval --impure --raw --expr \
              "let f = builtins.getFlake \"path:${PWD}\"; in f.inputs.nixpkgs.legacyPackages.\"${system}\".${attr}.drvPath" 2>/dev/null)" || continue
            if nix-store -r "${pkg_drv}" > /dev/null 2>&1; then
              while read -r o; do
                [[ -n "${o}" ]] || continue
                nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
              done < <(nix-store -q --outputs "${pkg_drv}" 2>/dev/null || true)
              printf '  nixpkgs#%s realised\n' "${attr}"
              shell_done=$((shell_done + 1))
            fi
          done
          echo "PASS CACHE-NIXPKG-ATTRS: ${shell_done} of ${#shell_attrs[@]} nixpkgs# attribute(s) realised"

          # FLAKE `checks` -- a third thing tests build that is neither an app nor a
          # package.
          #
          #   nix build ".#checks.${system}.openconfig-yang-validation" --no-link
          #
          # measured in network-labs FS-162-HDS-010-SDS-020-SMS-010: 1403 derivations
          # built inside the test for a check nobody had warmed. These are ordinary
          # derivations, so realising the whole set here is the fix, and it is bounded
          # by the same clock.
          mapfile -t check_names < <(nix eval --json --impure "path:${PWD}#checks.${system}" \
            --apply builtins.attrNames 2>/dev/null | jq -r '.[]?' 2>/dev/null || true)
          checks_done=0
          for chk in "${check_names[@]}"; do
            (( SECONDS - apps_started < apps_budget )) || { echo "  checks budget reached"; break; }
            # `.#checks`, THE RELATIVE FORM THE TESTS USE -- not `path:$PWD#checks`.
            # Measured on network-labs openconfig-peer-posture:
            #
            #   nix eval  ".#checks.<sys>.openconfig-peer-posture.drvPath"      -> nw6jgxbd
            #   nix eval  "path:$PWD#checks.<sys>.openconfig-peer-posture.drvPath" -> ivgr3wng
            #
            # Two derivations. The suites write `.#checks.${system}.<name>`, so warming
            # the `path:` spelling built something no test asks for -- the same mistake
            # as fix #4, made again one layer down, which is why 9 of 9 checks could be
            # "realised" and the test still built 1400 derivations.
            # PER-CHECK TIMEOUT, because the shared budget is checked BEFORE each item and
            # therefore cannot bound a single build. Measured in
            # network-control-plane-model run 45952784175: after
            # "PASS CACHE-NIXPKGS-ATTRS: 0 of 1", this loop ran 06:39:41 -> 07:36:56 and
            # the job died at its 60-minute timeout with every test job skipped. A check
            # that cannot be built inside its own slice is reported and skipped, which is
            # the same outcome the shared budget would have produced, only sooner.
            chk_out="$(timeout "${CHECK_ITEM_BUDGET_SECONDS:-240}" \
              nix build --no-link --print-out-paths ".#checks.${system}.${chk}" 2>/dev/null)" || {
              echo "::warning::check ${chk} not built within ${CHECK_ITEM_BUDGET_SECONDS:-240}s; skipped"
              continue
            }
            [[ -n "${chk_out}" ]] || continue
            while read -r o; do
              [[ -n "${o}" ]] || continue
              nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
            done <<<"${chk_out}"
            checks_done=$((checks_done + 1))
          done
          echo "PASS CACHE-CHECKS: ${checks_done} of ${#check_names[@]} flake check(s) realised"


      - name: "Export the store closure for the test jobs"
        shell: bash
        run: |
          set -uo pipefail
          # The derivations the warm step resolved and built. Read from the manifest
          # rather than recomputed: an app whose program the previous step could not
          # turn into a derivation must fail there, once, and not be silently skipped
          # here as well.
          # No app derivations is expected for a repository that declares no apps. The
          # thing that must not happen -- an export with nothing in it -- is still caught
          # by `paths_count == 0` below.
          touch "${RUNNER_TEMP}/app-drvs.txt"
          mapfile -t drvs < "${RUNNER_TEMP}/app-drvs.txt"
          : > /tmp/store-paths.txt
          # THE DERIVATIONS AND THEIR OUTPUTS, BOTH.
          #
          # `nix-store -qR <drv>` walks a derivation's references, which is other .drv
          # files and the inputs they name -- not the path the derivation PRODUCES. So
          # this loop shipped 1896 paths that were mostly derivations, and a test that
          # ran `nix run .#compile` found no compiler: it went on to build bash-5.3 and
          # Nix 2.31.3 from source and died on `bash-5.3.tar.gz` from ftpmirror.gnu.org,
          # which the closed store then refused (run 45527750114).
          #
          # The real outputs are recorded by the warm step. Their runtime closure is what
          # an executed binary needs, and `-qR` on an output does include it.
          #
          # THIS IS WHY app-outs.txt MUST HOLD OUTPUTS AND NEVER .drv FILES. The warm step
          # realises a stdenv and records it; recording the .drv made the export ship
          # `-qR <drv>`, which is derivations and not one built path -- so the stdenv was
          # realised in `list`, never travelled, and the first real build in a test
          # bootstrapped 1579 derivations from busybox. The warm writes
          # `nix-store -q --outputs` for exactly this reason.
          for drv in "${drvs[@]}"; do
            nix-store -qR "${drv}" >> /tmp/store-paths.txt
          done
          if [[ -s "${RUNNER_TEMP}/flake-input-paths.txt" ]]; then
            mapfile -t finputs < "${RUNNER_TEMP}/flake-input-paths.txt"
            for fin in "${finputs[@]}"; do
              nix-store -qR "${fin}" >> /tmp/store-paths.txt
            done
            echo "flake inputs: ${#finputs[@]}"
          fi
          if [[ -s "${RUNNER_TEMP}/app-outs.txt" ]]; then
            mapfile -t outs < "${RUNNER_TEMP}/app-outs.txt"
            for out in "${outs[@]}"; do
              nix-store -qR "${out}" >> /tmp/store-paths.txt
            done
            echo "app outputs: ${#outs[@]}"
          else
            # A repository with no apps legitimately has none to record. What must not
            # happen is an export that carries only derivations and no outputs, so that
            # case is still caught below by `paths_count == 0`.
            echo "no app outputs recorded (this repository may declare no apps)"
          fi
          sort -u -o /tmp/store-paths.txt /tmp/store-paths.txt
          # Zero paths exported is the exact failure that shipped: the artifact step
          # then finds no file, warns, and 98 jobs download nothing. Fail here, where
          # the cause is visible, instead of 98 times downstream.
          paths_count="$(wc -l < /tmp/store-paths.txt)"
          echo "exporting ${paths_count} store paths"
          if (( paths_count == 0 )); then
            echo "::error::exported 0 store paths; the test jobs would substitute everything"
            exit 1
          fi
          mapfile -t paths < /tmp/store-paths.txt
          # -3, NOT -19. Measured on a 704 MB export of a real closure, 4 threads:
          #
          #   zstd -3  -T4:   3 s -> 226 MB
          #   zstd -9  -T4:  11 s -> 193 MB
          #   zstd -19 -T4: 265 s -> 171 MB
          #
          # -19 costs 262 extra seconds to save 55 MB, on an artifact with
          # retention-days: 1. Worse, it stalls on the larger exports this actually
          # produces (1.5 GiB+), which is the export the tests were waiting on.
          #
          # The default level is the right trade: compression is not what this artifact
          # is for, delivering a store is.
          nix-store --export "${paths[@]}" | zstd -3 -T0 -o "${RUNNER_TEMP}/nix-store.nar.zst"
          ls -lh "${RUNNER_TEMP}/nix-store.nar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: nix-store
          path: "${{ runner.temp }}/nix-store.nar.zst"
          retention-days: 1
          # `warn` here is how the broken warm step stayed invisible: the artifact
          # silently did not exist and every consumer failed 30 minutes later.
          if-no-files-found: error

  test:
    name: "${{ matrix.test || format('shard {0}', matrix.shard) }}"
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    strategy:
      # Not a failure: the shape of a CI run. One red per run means as many runs as
      # defects, and the whole point of the matrix is that one run reports them all.
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6
      # 3 MB single binary, no daemon, no installer script. Measured against
      # cachix/install-nix-action: that one downloads the 26 MB Nix tarball and runs
      # the multi-user installer (users, systemd units, /etc/nix) in every job; the
      # suites need `nix eval` and a store, not a daemon.
      # Everything Nix needs, cached on GitHub's side and keyed by the lock.
      #
      # /nix holds the installed Nix, every store path the suite has ever needed, and
      # ~/.cache/nix holds the evaluated flake inputs. Keyed on flake.lock, so a job
      # for the same pins restores a warm tree instead of installing Nix and
      # resolving nixpkgs again. First job after a lock change pays; the rest do not.
      # /nix must exist before the cache is unpacked: the archive's members are
      # absolute store paths and tar cannot create the missing parent, so a restore
      # into a runner with no /nix fails member by member ("Cannot open: No such file
      # or directory") and the job downloads everything anyway.
      - name: "Prepare /nix for the cache"
        shell: bash
        run: |
          sudo mkdir -p /nix
          sudo chown -R "$(id -u):$(id -g)" /nix

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: nixcache
        with:
          path: |
            /nix
            /home/runner/.cache/nix
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-apps-v2
          restore-keys: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-

      - if: steps.nixcache.outputs.cache-hit != 'true'
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes

      # On a hit there was no installer to run, so `nix` is on disk but neither on
      # PATH nor reachable through the profile symlink the installer creates in
      # $HOME: nix-quick-install appends `$HOME/.nix-profile/bin`, and that symlink
      # lives outside /nix, so the cache does not carry it.
      - if: steps.nixcache.outputs.cache-hit == 'true'
        name: "Put the restored Nix on PATH"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/nix/var/nix/profiles/per-user"
          ln -sfn "/nix/var/nix/profiles/per-user/${USER}" "${HOME}/.nix-profile"
          # /etc/nix/nix.conf comes from the installer, which did not run on a hit.
          # Without it every nix command dies with "experimental Nix feature
          # 'nix-command' is disabled", which is what a restored cache produced.
          if [[ ! -f /etc/nix/nix.conf ]]; then
            sudo mkdir -p /etc/nix
            printf 'experimental-features = nix-command flakes\n' | sudo tee /etc/nix/nix.conf >/dev/null
          fi
          for candidate in "${HOME}/.nix-profile/bin" \
                           "/nix/var/nix/profiles/default/bin" \
                           "/nix/var/nix/profiles/per-user/${USER}/bin"; do
            [[ -x "${candidate}/nix" ]] && printf '%s\n' "${candidate}" >> "${GITHUB_PATH}"
          done
          if ! command -v nix >/dev/null; then
            # Last resort: the store is what was restored, so the binary is in it.
            store_nix="$(find /nix/store -maxdepth 3 -name nix -type f -perm -u+x 2>/dev/null | head -1)"
            if [[ -n "${store_nix}" ]]; then
              printf '%s\n' "$(dirname "${store_nix}")" >> "${GITHUB_PATH}"
            fi
          fi

      - name: "Nix is available"
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nix >/dev/null; then
            echo "nix was restored but is not on PATH; /nix/var/nix/profiles:" >&2
            ls -la /nix/var/nix/profiles /nix/var/nix/profiles/per-user 2>&1 | sed 's/^/  /' >&2
            exit 1
          fi
          nix --version

      # The store the warm job exported, imported into this runner: the tests build
      # their own derivations, and with the closure present they substitute nothing.
      #
      # No `continue-on-error`: a missing artifact is the failure mode that shipped.
      # Without it this step "succeeds", the test runs against a cold store, and it
      # substitutes the whole closure from cache.nixos.org -- which looks like a pass
      # and is the opposite of what the warm job exists for.
      - uses: actions/download-artifact@v4
        with:
          name: nix-store
          path: "${{ runner.temp }}"
      - name: "Import the passed nix store"
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "${RUNNER_TEMP}/nix-store.nar.zst" ]]; then
            echo "::error::no store artifact; every test in this job would substitute from the network"
            exit 1
          fi
          zstd -dc "${RUNNER_TEMP}/nix-store.nar.zst" | nix-store --import >"${RUNNER_TEMP}/imported-paths.txt"
          printf 'imported %s path(s)\n' "$(grep -c . "${RUNNER_TEMP}/imported-paths.txt")"

      # WARM THIS REPOSITORY'S APPS, WITH THE REFERENCE FORM THE TESTS USE.
      #
      # Two things this had to learn, both measured on network-compiler:
      #
      # 1. `path:$PWD`, NOT `$PWD`. The two produce different derivations because the
      #    `path:` flake URL yields different sourceInfo, and the suites resolve
      #    `path:${repo_root}#...`. A warm under the bare form built something no test
      #    would ask for: 950 derivations rebuilt from source against a closed store.
      #
      # 2. WHICH apps is not a constant. This fleet names them compile, default,
      #    render-openconfig, deploy-clab, compile-and-build-forwarding-model, ... and
      #    four repositories declare none at all because they produce data, not
      #    programs. So the list is READ from the flake, and "no apps" is a pass.
      #
      # `nix-store -r <drv>` realises the derivation AND its build inputs; `nix build`
      # on the program path pulls neither.
      - name: "Warm this repository's apps"
        shell: bash
        run: |
          set -uo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          flake_ref="path:${PWD}"
          mapfile -t apps < <(nix eval --json --impure "${flake_ref}#apps.${system}" \
            --apply builtins.attrNames 2>/dev/null | jq -r '.[]?' 2>/dev/null || true)
          if (( ${#apps[@]} == 0 )); then
            echo "PASS WARM-APPS: this repository declares no apps; nothing to warm"
            exit 0
          fi
          warmed=0
          seen=""
          for app in "${apps[@]}"; do
            # EVERY SPELLING THE SUITES USE, DEDUPED BY DERIVATION.
            #
            # `path:$PWD#`, `$PWD#` and `.#` are different source identities, so a suite
            # may ask for any of them. Warming all three unconditionally realises the
            # same closure repeatedly when they agree -- which is what made the log read
            # "default realised via ... / realised via ... / realised via ..." for one
            # app -- so a derivation already seen is skipped instead.
            drvs=""
            for try_ref in "${flake_ref}" "${PWD}" "."; do
              d="$(nix eval --raw --impure "${try_ref}#apps.${system}.${app}.program" \
                --apply 'p: builtins.head (builtins.filter (n: builtins.match ".*\\.drv" n != null) (builtins.attrNames (builtins.getContext p)))' 2>/dev/null)" || continue
              case " ${drvs} " in *" ${d} "*) continue ;; esac
              drvs="${drvs} ${d}"
              case " ${seen} " in
                *" ${d} "*) ;;                       # already realised for another app
                *) if nix-store -r "${d}" > /dev/null 2>&1; then
                     seen="${seen} ${d}"
                     warmed=$((warmed + 1))
                   else
                     echo "::warning::app ${app} (${d}) could not be realised"
                   fi ;;
              esac
            done
            if [[ -n "${drvs}" ]]; then
              printf '  %-34s %s derivation(s), all realised\n' "${app}" "$(wc -w <<<"${drvs}")"
            else
              printf '  %-34s no derivation in its program string; skipped\n' "${app}"
            fi
          done
          echo "PASS WARM-APPS: ${warmed} distinct app derivation(s) realised for ${#apps[@]} app(s)"

      - name: "Verify the cache: everything the tests need is already present"
        shell: bash
        run: |
          set -uo pipefail
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          failures=0

          if nix print-dev-env ".#devShells.${system}.default" > "${RUNNER_TEMP}/dev-env.txt" 2>"${RUNNER_TEMP}/dev-env.err"; then
            echo "PASS CACHE-ENV: the devShell environment is in the store"
            # AND HAND ITS PATH TO THE LATER STEPS.
            #
            # `nix develop -c bash` was the documented way to run a step in a flake's
            # environment, and it does not work here: it constructs a `network-tests-env`
            # derivation that `print-dev-env` never names, so the artifact cannot contain
            # it and the closed store bootstraps 151 derivations instead
            # (run 45670950104: PASS CACHE-ENV at line 296, 151 derivations at 693).
            #
            # print-dev-env IS satisfied by the artifact, so its PATH is what the tests
            # get. Exported here rather than in a later step because this one runs
            # BEFORE the store closes and before the offline wrapper is installed --
            # the same conditions under which it was proven to work.
            shell_path="$(grep -m1 "^PATH='" "${RUNNER_TEMP}/dev-env.txt" | sed "s/^PATH='//; s/'$//")"
            if [[ -n "${shell_path}" ]]; then
              added=0
              for d in ${shell_path//:/ }; do
                [[ -d "${d}" ]] || continue
                printf '%s\n' "${d}" >> "$GITHUB_PATH"
                added=$((added + 1))
              done
              echo "PASS CACHE-PATH: ${added} PATH entries exported from the flake's devShell"
            else
              echo "::error::CACHE-PATH: print-dev-env produced no PATH"
              failures=$((failures + 1))
            fi
          else
            echo "::error::CACHE-ENV: .#devShells.${system}.default is NOT in the store"
            sed 's/^/  /' "${RUNNER_TEMP}/dev-env.err" >&2 || true
            failures=$((failures + 1))
          fi

          # THE DERIVATION'S OUTPUT, not the program path inside it.
          #
          # Checking `nix path-info "$prog"` where prog is `<out>/bin/app` asks whether a
          # file inside an output exists; the question is whether the OUTPUT is present.
          # Resolve the derivation the same way the test does -- `path:` -- and look at
          # what it produces.
          # EVERY app this flake declares, or none.
          #
          # Hardcoding `compile` was wrong: this fleet names its apps compile, default,
          # render-openconfig, deploy-clab, ... and four repositories declare none at
          # all because they produce data rather than programs. A check that assumes a
          # name reports a cache failure for a repository that simply has no apps.
          mapfile -t app_names < <(nix eval --json --impure "path:${PWD}#apps.${system}" \
            --apply builtins.attrNames 2>/dev/null | jq -r '.[]?' 2>/dev/null || true)
          if (( ${#app_names[@]} == 0 )); then
            echo "PASS CACHE-APP: this repository declares no apps; nothing to verify"
          else
            missing_apps=()
            for app in "${app_names[@]}"; do
              d="$(nix eval --raw --impure "path:${PWD}#apps.${system}.${app}.program" \
                --apply 'p: builtins.head (builtins.filter (n: builtins.match ".*\\.drv" n != null) (builtins.attrNames (builtins.getContext p)))' 2>/dev/null)" || continue
              o="$(nix-store -q --outputs "${d}" 2>/dev/null | head -1)" || o=""
              if [[ -n "${o}" ]] && nix path-info "${o}" >/dev/null 2>&1; then
                printf '  %-34s present\n' "${app}"
              else
                missing_apps+=("${app}:${o:-<no output>}")
              fi
            done
            if (( ${#missing_apps[@]} == 0 )); then
              echo "PASS CACHE-APP: all ${#app_names[@]} app output(s) in the store"
            else
              echo "::error::CACHE-APP: ${#missing_apps[@]} app output(s) NOT in the store"
              printf '  %s\n' "${missing_apps[@]}"
              failures=$((failures + 1))
            fi
          fi

          # PIN `<nixpkgs>` FOR EVERY TEST IN THIS JOB, FROM THIS REPOSITORY'S LOCK.
          #
          # `import <nixpkgs>` resolves through NIX_PATH, and NIX_PATH is not the same
          # here as on a workstation: CI sets it to the empty string, which is not
          # "unset" -- the default `nixpkgs=flake:nixpkgs` entry only exists when the
          # variable is absent. A case using `<nixpkgs>` therefore evaluated a different
          # nixpkgs in CI and asserted on a different `lib`, green locally and red here
          # (measured: test-canonical-stage-link-matrix.sh).
          #
          # The fleet has 84 such uses across five repositories, so this is fixed once
          # for the job rather than 84 times: point NIX_PATH at the nixpkgs this
          # repository's own lock pins. The flake gate already materialised those inputs,
          # so no fetch is implied.
          if nix_path_pin="$(nix eval --raw --impure --expr \
               "(builtins.getFlake \"path:${PWD}\").inputs.nixpkgs.outPath" 2>/dev/null)" \
             && [[ -n "${nix_path_pin}" ]]; then
            printf 'NIX_PATH=nixpkgs=%s\n' "${nix_path_pin}" >> "$GITHUB_ENV"
            echo "PASS CACHE-NIXPATH: <nixpkgs> pinned to ${nix_path_pin}"
          else
            echo "::warning::could not read the nixpkgs pin; <nixpkgs> will use the ambient NIX_PATH"
          fi

          # THE PINNED NIXPKGS' STDENV, NOT JUST ITS TOOLS.
          #
          # Pinning NIX_PATH was half the fix. The suites evaluate `<nixpkgs>` and BUILD
          # against it, and the devShell only ever realised the six tools -- their
          # closure carries glibc and gcc-libs but not a stdenv, so the first real build
          # in a test started a full bootstrap:
          #
          #   these 1414 derivations will be built:
          #     ...-hex0-seed.drv ...-stage0-posix-1.9.1-source.drv ...-patch-2.5.9.tar.gz.drv
          #
          # (network-labs job 139535784491, with every cache gate reporting PASS).
          #
          # Realising the stdenv derivation here, while the store is OPEN and the
          # substituter is reachable, is what makes those builds unnecessary later.
          if stdenv_drv="$(nix eval --raw --impure --expr \
               "let f = builtins.getFlake \"path:${PWD}\"; in f.inputs.nixpkgs.legacyPackages.\"${system}\".stdenv.drvPath" 2>/dev/null)" \
             && [[ -n "${stdenv_drv}" ]]; then
            if nix-store -r "${stdenv_drv}" > /dev/null 2>&1; then
              while read -r o; do
                [[ -n "${o}" ]] || continue
                nix path-info "${o}" >/dev/null 2>&1 && printf '%s\n' "${o}" >> "${RUNNER_TEMP}/app-outs.txt"
              done < <(nix-store -q --outputs "${stdenv_drv}" 2>/dev/null || true)
              echo "PASS CACHE-STDENV: stdenv realised (${stdenv_drv})"
            else
              echo "::warning::could not realise the pinned nixpkgs stdenv"
            fi
          else
            echo "::warning::could not resolve the pinned nixpkgs stdenv"
          fi



          if (( failures != 0 )); then
            echo "::error::CACHE: ${failures} item(s) missing; the test failures below would be cache artefacts, not defects"
            exit 1
          fi
          echo "PASS CACHE: the cache is complete, so any failure from here is the test"

      # A NETWORK NAMESPACE, NOT JUST A FLAG.
      #
      # Measured on the runner image: `nix --offline` does NOT block flake INPUT
      # fetching. A test that runs `nix flake prefetch github:...` reaches the network
      # even with `--offline` on the command line and empty substituters, because
      # `--offline` governs substitution, not fetchers. Reproduced:
      #
      #   nix --offline flake prefetch github:NixOS/nonexistent-repo-xyz123
      #   error: unable to download 'https://api.github.com/repos/.../commits/HEAD'
      #
      # A 404 from api.github.com is proof the request left the machine. So the test
      # runs inside a network namespace with no interfaces but loopback, where the
      # request cannot leave at all and Nix says so itself:
      #
      #   warning: you don't have Internet access; disabling some network-dependent
      #   features
      #
      # That warning is the point: enforcement by the kernel, reported by Nix, and
      # visible in the transcript the assertion below greps.
      # A NETWORK NAMESPACE, NOT JUST A FLAG.
      #
      # Measured: `nix --offline` does NOT block flake INPUT fetching --
      # `nix --offline flake prefetch github:...` still opens a connection, because
      # `--offline` governs substitution, not fetchers. So the test runs in a network
      # namespace, where Nix itself reports
      #   warning: you don't have Internet access; disabling some network-dependent
      #   features
      #
      # Which namespace a host offers is a property of the host, and this fleet already
      # measured it: tests/lib/nft-netns-check.sh in
      # network-renderer-containerlab-linux-backend records that a GitHub-hosted
      # ubuntu-26.04 runner restricts unprivileged user namespaces, so `unshare -Urn`
      # dies with
      #   unshare: write failed /proc/self/uid_map: Operation not permitted
      # while `sudo -n unshare -n` works (the runners give passwordless sudo; the
      # /nix prepare step already uses it). Same order as that helper: user namespace
      # first, root namespace second, hard failure if neither -- never a silent pass.
      - name: "Verify the test can run with no network"
        shell: bash
        run: |
          # PUT THE SHIM ON PATH BEFORE THE NAMESPACE IS BUILT.
          #
          # `netns` below bakes in `PATH=${PATH}` -- sudo scrubs the environment, so the
          # caller's PATH has to be carried explicitly. That means a PATH export in the
          # test step is too late: it never reaches the command the namespace runs, and
          # the suites would still call the real `nix flake archive` and still fetch
          # github: tarballs. Setting it here is what actually takes effect.
          if [[ -d ${PWD}/tests/lib/bin ]]; then
            PATH="${PWD}/tests/lib/bin:${PATH}"
            export PATH
          fi
          set -euo pipefail
          netns=""
          # `sudo` drops PATH; the suites call `nix`, `jq`, `python3` and `rg` by name, so
          # the caller's PATH is carried through `env`. Without this the run step failed
          # with "failed to execute /usr/bin/script: No such file or directory".
          if unshare -Urn true >/dev/null 2>&1; then
            netns="unshare -Urn"
          elif sudo -n env "PATH=${PATH}" "NIX_PATH=${NIX_PATH:-}" unshare -n true >/dev/null 2>&1; then
            # NIX_PATH TRAVELS WITH PATH, for the same reason and by the same mechanism.
            # `sudo` scrubs the environment, so `import <nixpkgs>` inside the namespace
            # resolved against nothing:
            #
            #   error: file 'nixpkgs/lib' was not found in the Nix search path
            #          (add it using $NIX_PATH or -I)
            #
            # measured in network-control-plane-model run 45961240754, shard 5, case
            # FS-530-HDS-010-SDS-010-SMS-010 -- while the job's own audit step reported
            # PASS CACHE-NIXPATH, because the pin was set for the job and then dropped by
            # sudo before the test ever ran.
            netns="sudo -n env PATH=${PATH} NIX_PATH=${NIX_PATH:-} unshare -n"
          else
            echo "::error::this host gives no network namespace, so an offline run cannot be verified"
            exit 1
          fi
          # GIT MUST SEE THE REPOSITORY AS ROOT TOO.
          #
          # The namespace form that works here is `sudo -n env PATH=... unshare -n`, so
          # the tests run as root. actions/checkout registers the workspace as a safe
          # directory for the RUNNER user only, so as root git refuses it --
          #   fatal: detected dubious ownership in repository at ...
          # -- and Nix's path-flake dirty detection then differs from the warm step's,
          # which changes self.sourceInfo and therefore the app derivation. Measured:
          # warm resolved 0dysk2a6...-app.drv and the test then wanted
          # 1yhkdwgl...-app.drv (run 45559663953).
          #
          # Registering the same directory for root makes both sides read the same git
          # state, so the derivation the test asks for is the one that was warmed.
          sudo -n git config --global --add safe.directory "${PWD}" 2>/dev/null || true
          if ${netns} git -C "${PWD}" rev-parse --show-toplevel >/dev/null 2>&1; then
            echo "git sees ${PWD} inside the namespace"
          else
            echo "::warning::git cannot read ${PWD} inside the namespace; a path-flake dirty state may differ from the warm step"
          fi
          printf 'NIX_NETNS=%s\n' "${netns}" >> "$GITHUB_ENV"
          echo "namespace: ${netns}"
          # `sudo` resets PATH, so a bare `nix` inside the namespace is "No such file
          # or directory" -- measured in job 138907381062. `env PATH=...` carries the
          # caller's PATH through sudo, which the tests need anyway: they call `nix`,
          # `jq`, `python3` and `rg` by their bare names.
          #
          # NO BUILD USERS, ON PURPOSE.
          #
          # A test that builds a derivation of its own failed on the restored store:
          #
          #   error: the group 'nixbld' specified in 'build-users-group' does not exist
          #
          # because the /nix cache restores /nix and not /etc/group. Creating the group
          # and 32 users fixed the message and produced the next one --
          #
          #   error: the build users group 'nixbld' has no members
          #
          # -- measured in run 45527121607: the users were never created, and would have
          # been a root-owned build account on a shared runner either way.
          #
          # The build users exist to drop privileges when a Nix DAEMON builds as root.
          # These jobs run Nix as an unprivileged, single-purpose user whose store is
          # already theirs, so there is no privilege to drop. Measured locally with
          # `build-users-group =`: a plain derivation builds and produces its output.
          # Setting it empty removes the dependency on an account the cache cannot carry.
          printf 'build-users-group =\n' | sudo tee -a /etc/nix/nix.conf >/dev/null
          printf 'build-users-group =\n' >> "$GITHUB_ENV"
          echo "build-users-group: '$(nix config show build-users-group)'"

          # `nix config show` rather than `nix eval`: it exits 0 inside the namespace, so
          # the only thing this greps for is the offline warning itself, and it also
          # prints the substituter list the namespace will see.
          nix_bin="$(command -v nix)"
          out="$(${netns} "${nix_bin}" config show substituters 2>&1 || true)"
          if ! grep -qi "don't have Internet access" <<<"${out}"; then
            echo "::error::Nix did not report offline mode inside the namespace"
            printf '%s\n' "${out}" | head -10
            exit 1
          fi
          echo "PASS OFFLINE-NAMESPACE: no network, and Nix reports it"

      - name: "Close the store: no substituters, no network"
        shell: bash
        run: |
          set -euo pipefail
          # Nix has no `substituters` ENVIRONMENT variable. Lines like
          # `substituters =` in $GITHUB_ENV are not settings a Nix process ever reads,
          # and `substituters ` is not even a valid environment name. The settings live
          # in nix.conf, and NIX_CONFIG is appended to it, so the closed configuration
          # goes to both: NIX_CONFIG for this step and every later one, /etc/nix/nix.conf
          # for a `nix` that does not inherit this environment (a test that re-execs
          # through sudo, for instance).
          #
          # Built line by line: a YAML block scalar would carry this file's indentation
          # into the value, and Nix would read "          substituters" as a name.
          closed_config="$(printf '%s\n' \
            'substituters =' \
            'extra-substituters =' \
            'builders =' \
            'builders-use-substitutes = false' \
            'flake-registry =' \
            'experimental-features = nix-command flakes')"
          {
            echo 'NIX_CONFIG<<__CLOSED_CONFIG__'
            printf '%s\n' "${closed_config}"
            echo '__CLOSED_CONFIG__'
          } >> "$GITHUB_ENV"
          printf '%s\n' "${closed_config}" | sudo tee -a /etc/nix/nix.conf >/dev/null
          export NIX_CONFIG="${closed_config}"
          # Asserted, not assumed: measured here, these lines empty both lists, and
          # `nix eval` of this flake still works with them set.
          printf 'substituters: [%s]\nbuilders: [%s]\n' \
            "$(nix config show substituters)" "$(nix config show builders)"
          if [[ -n "$(nix config show substituters | tr -d '[:space:]')" ]]; then
            echo "::error::substituters are still configured; a missing path would be downloaded"
            exit 1
          fi

      # ROOT'S ANSWER, STATED IN THE LOG.
      #
      # This runs after the store is closed, so it cannot build anything -- it only
      # resolves, offline, the derivation root will ask for, and prints it beside the
      # one the warm built. If they differ, this line says so before the test fails,
      # which turns the next run's log into the evidence that has been missing.
      # `--offline` is a FLAG, not a setting, and the suites shell out to bare `nix`
      # 200+ times (`nix run`, `nix build`, `nix flake archive`) in ways no NIX_CONFIG
      # can cover. A wrapper on PATH is the only place that catches all of them: every
      # `nix` invocation becomes `nix --offline <args>` unless the caller already said
      # `--offline`. With substituters emptied above, a missing path is now an error
      # that names the path, not a silent download.
      - name: "Check rootless podman as a fallback sandbox"
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v podman >/dev/null; then
            echo "podman: not installed; the unshare namespace is the sandbox"
            exit 0
          fi
          if ! podman run --rm --network=none docker.io/library/alpine:latest \
                 sh -c 'echo ok' >/dev/null 2>&1; then
            echo "podman: installed but rootless containers are not usable here"
            exit 0
          fi
          echo "podman: rootless, network=none verified"

      - name: "Force --offline on every nix invocation"
        shell: bash
        run: |
          set -euo pipefail
          wrapper_dir="${RUNNER_TEMP}/offline-bin"
          mkdir -p "${wrapper_dir}"
          real_nix="$(command -v nix)"
          if [[ "${real_nix}" == "${wrapper_dir}/nix" ]]; then
            echo "::error::the offline wrapper resolved to itself"
            exit 1
          fi
          cat > "${wrapper_dir}/nix" <<WRAPPER
          #!/usr/bin/env bash
          # Generated by .github/workflows/tests-matrix.yml. Not a convenience: a test
          # that reaches the network must fail, and this is where it fails.
          set -uo pipefail
          real_nix="${real_nix}"
          for arg in "\$@"; do
            [[ "\${arg}" == "--offline" ]] && exec "\${real_nix}" "\$@"
          done
          exec "\${real_nix}" --offline "\$@"
          WRAPPER
          chmod +x "${wrapper_dir}/nix"
          printf '%s\n' "${wrapper_dir}" >> "$GITHUB_PATH"
          echo "wrapper: ${wrapper_dir}/nix -> ${real_nix} --offline"
          "${wrapper_dir}/nix" --version
          # Proof, as configuration rather than as an anecdote: with the wrapper on PATH,
          # any `nix` a test invokes is `nix --offline`, and there is no substituter and
          # no remote builder for it to reach.
          #
          # Not asserted here: "build something that is not in the store and watch it
          # fail". Whether a package is already in the restored store is a fact about the
          # cache, not about the configuration, so such a probe passes or fails for
          # reasons unrelated to what this step sets up. Measured once: `nix --offline
          # build nixpkgs#hello` SUCCEEDED on a warm store and looked like a broken
          # guarantee when it was only a hit.
          substituters="$(nix config show substituters)"
          builders="$(nix config show builders)"
          printf 'substituters: %s\nbuilders: %s\n' "${substituters}" "${builders}"
          if [[ -n "${substituters//[[:space:]]/}" ]]; then
            echo "::error::substituters are still configured ('${substituters}'); a missing path would be downloaded"
            exit 1
          fi
          if [[ -n "${builders//[[:space:]]/}" ]]; then
            echo "::error::remote builders are still configured ('${builders}')"
            exit 1
          fi
          # `GITHUB_PATH` applies to LATER steps, so `command -v nix` here still finds the
          # real binary -- asserting on it in this step failed job 138908084389 with
          # "the nix a test resolves is not the offline wrapper" when the wiring was in
          # fact correct. The assertion is therefore on the ordering inside GITHUB_PATH,
          # which is what a later step's lookup will use: the wrapper directory must come
          # before the real nix's directory.
          wrapper_line="$(grep -n "^${wrapper_dir}$" "$GITHUB_PATH" | cut -d: -f1)"
          real_line="$(grep -n "^${real_nix%/*}$" "$GITHUB_PATH" | cut -d: -f1 || true)"
          if [[ -z "${wrapper_line}" ]]; then
            echo "::error::the wrapper directory is not on GITHUB_PATH"
            exit 1
          fi
          printf 'GITHUB_PATH: wrapper at line %s, real nix dir at line %s\n' \
            "${wrapper_line}" "${real_line:-<inherited>}"
          echo "PASS OFFLINE-CONFIG: wrapper precedes the real nix on PATH, no substituter, no builder"

      - id: discover
        name: "Discover entrypoints"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/lib/discover-tests.sh ]]; then
            # shellcheck source=/dev/null
            source scripts/lib/discover-tests.sh
            mapfile -t names < <(discover_tests "$PWD")
          else
            # A repository without the contract falls back to the naming rule the
            # contract encodes, so this workflow still works during a migration.
            mapfile -t names < <(
              find tests -maxdepth 1 -type f \
                \( -name 'test-*.sh' -o -name 'test_*.py' \
                   -o -regex '.*/FS-[0-9]+-HDS-[0-9]+-SDS-[0-9]+-\(SMS\|SIT\)-[0-9a-z][a-z0-9-]*\(-[a-z0-9-]+\)?\.\(sh\|py\)' \) \
                ! -name 'test.sh' -printf '%f\n' | LC_ALL=C sort
            )
          fi
          count="${#names[@]}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if ((count == 0)); then
            echo 'matrix={"shard":[]}' >> "$GITHUB_OUTPUT"
            echo "no entrypoints discovered; the matrix will be empty"
            exit 0
          fi
          # GitHub runs up to 256 matrix jobs; the cap is on the MATRIX, not on the
          # parallelism within it. So the default is one job per test -- every test in
          # its own runner, in parallel, named after itself -- and sharding is only a
          # fallback for a repository whose discovery exceeds the cap. Measured:
          # 124 entrypoints here, 287 in the control-plane model, 486 in network-labs.
          # Sharding 124 into 16 jobs of 8 was strictly worse: same wall clock, less
          # parallelism, and a failure named "shard 7" instead of the test.
          max_jobs=250
          if (( count <= max_jobs )); then
            json="$(printf '%s\n' "${names[@]}" | python3 -c 'import json,sys; print(json.dumps({"test":[l.strip() for l in sys.stdin if l.strip()]}))')"
            echo "shards=0" >> "$GITHUB_OUTPUT"
            echo "shard_size=1" >> "$GITHUB_OUTPUT"
            echo "matrix=${json}" >> "$GITHUB_OUTPUT"
            echo "discovered ${count} entrypoint(s): one job per test, in parallel"
          else
            shard_size="${TEST_SHARD_SIZE:-$(( (count + max_jobs - 1) / max_jobs ))}"
            shards=$(( (count + shard_size - 1) / shard_size ))
            echo "shards=${shards}" >> "$GITHUB_OUTPUT"
            echo "shard_size=${shard_size}" >> "$GITHUB_OUTPUT"
            json="$(python3 -c "import json;print(json.dumps({'shard':list(range(${shards}))}))")"
            echo "matrix=${json}" >> "$GITHUB_OUTPUT"
            echo "discovered ${count} entrypoint(s): ${shards} shard(s) of ${shard_size}, because ${count} exceeds the ${max_jobs}-job matrix cap"
          fi

      # Warm the BUILD closure, not just the evaluation inputs.
      #
      # `flake-check` runs `nix flake check --no-build`, so its store has every flake
      # input and nothing that a test builds. Every test job then pays for the same
      # closure: measured on FS-030-HDS-010-SDS-040-SMS-010, 144 paths / 111 MiB,
      # including git (2.52.0) whose `out` references its own 15.1 MiB `-doc` output.
      # The closure is warmed ONCE, in `list` (see "Warm the build closure" there),
      # and reached these jobs as the `nix-store` artifact. This block used to be
      # duplicated here, and the duplicate is the copy that kept the broken
      # `nix build .#apps.<sys>.<name>` spelling long enough to ship: two copies of a
      # step are two chances to fix one of them. Removed, not repaired.

      # jq and ripgrep ship with the runner image. sops is 45 MB and yq is 10 MB,
      # and 47 of 1689 test files name sops while 2 name yq -- so they are fetched
      # only by the jobs whose test uses them.
      #
      # The artifact this replaces was built once and did not run: `cp -L` out of the
      # Nix store copies the binary but not its closure, and the copied jq failed with
      # "cannot execute: required file not found" (it loads libjq.so.1 from a store
      # path the next job does not have). A store path is not a portable binary.
      # NO TOOL IS INSTALLED OUTSIDE flake.nix.
      #
      # This step used to ensure jq from the image, download ripgrep 2.5 MB from GitHub
      # releases, and fetch sops (45 MB) and yq (10 MB) for the tests that named them.
      # None of it was declared, so none of it could be cached: the environment was
      # implicit and every job re-fetched it.
      #
      # The tools now come from `.#devShells.<system>.default`, which is the repo-root
      # flake's declaration of exactly what the suites invoke (measured: nix 501, jq 197,
      # git 84, ssh 13, python3 3, rg 2). The run step below uses that shell, so there is
      # nothing to install and nothing to put on PATH by hand.
      #
      # This step only ASSERTS that the declaration holds, and it does so inside the same
      # shell the tests run in -- so a missing tool fails here, named, instead of midway
      # through a suite.
      # INSTALL WHAT THE IMAGE LACKS, BEFORE THE STORE CLOSES.
      #
      # FS-540-HDS-010-SDS-010-SMS-035 needs `age-keygen` and `sops`; both are on a
      # developer machine and neither is on the runner image, so the case failed in CI only.
      # Best effort: a package that does not exist here is not fatal, because the assertion
      # below names whatever is still missing.
      - name: "Install the tools the suites declare"
        shell: bash
        run: |
          set -uo pipefail
          # APT FIRST, NIXPKGS WHEN APT HAS NOTHING.
          #
          # The runner image is the arbiter of what `apt-get` has, and it changes under us:
          # `sops` is in the image's universe pocket on one release and absent on the next.
          # Measured in run 46084235343 -- apt had no `sops`, the step printed its note, and
          # two suites died at run time with
          #
          #     FAIL FS-540-HDS-010-SDS-010-SMS-035: missing required command: sops
          #
          # while this step was green. Falling back to the repository's own pinned nixpkgs
          # makes the tool available regardless of the pocket, and the versions then match
          # what a developer has.
          tool_bin="${RUNNER_TEMP}/suite-tools"
          mkdir -p "${tool_bin}"
          nix_attr() {
            case "$1" in
              conntrack) echo "conntrack-tools" ;;
              *) echo "$1" ;;
            esac
          }
          for pkg in age sops dnsutils nmap gron socat conntrack; do
            if sudo apt-get install -y -qq "${pkg}" >/dev/null 2>&1; then
              echo "apt: ${pkg}"
              continue
            fi
            attr="$(nix_attr "${pkg}")"
            # `--inputs-from` is load-bearing: a bare `nixpkgs#sops` resolves through the
            # flake REGISTRY, and on the runner that failed for every package --
            #
            #   neither apt nor nixpkgs#sops provides 'sops'
            #
            # (run 46118416614, the annotation from this very step). Asking for the
            # package through THIS repository's own locked nixpkgs is also the version a
            # developer has, which is what the tests were written against.
            outs="$(nix build --inputs-from "${PWD}" --no-link --print-out-paths "nixpkgs#${attr}" 2>/dev/null)" || {
              echo "::warning::neither apt nor this flake's nixpkgs#${attr} provides '${pkg}'"
              continue
            }
            linked=0
            while read -r out; do
              [[ -n "${out}" && -d "${out}/bin" ]] || continue
              for exe in "${out}"/bin/*; do
                ln -sf "${exe}" "${tool_bin}/" 2>/dev/null && linked=1
              done
            done <<<"${outs}"
            echo "nixpkgs#${attr}: ${pkg} (${linked})"
          done
          if [[ -n "$(ls -A "${tool_bin}" 2>/dev/null)" ]]; then
            printf 'PATH=%s:%s\n' "${tool_bin}" "${PATH}" >> "$GITHUB_ENV"
          fi

      - name: "Assert the flake declares every tool the tests use"
        shell: bash
        run: |
          set -euo pipefail
          # THE LIST IS DERIVED FROM THE SUITES, not typed here.
          #
          # `require_cmd X` and `for cmd in A B C; do command -v ...` are how a case declares
          # what it needs, and a hardcoded list missed them: FS-540-HDS-010-SDS-010-SMS-035
          # died on the runner with "missing required command: age-keygen" while local runs
          # passed, because `age` is on a developer machine and not on the image. Deriving the
          # list turns a mystery red job into a named missing tool.
          declared_tools="$(
            {
              grep -rhoE 'require_cmd [A-Za-z0-9_.-]+' tests 2>/dev/null | awk '{print $2}' || true
              grep -rhoE 'for (cmd|tool) in [A-Za-z0-9_.\- ]+' tests 2>/dev/null \
                | sed -E 's/^for (cmd|tool) in //' | tr ' ' '\n' || true
            } | sort -u | tr '\n' ' '
          )"
          echo "declared by the suites: ${declared_tools}"
          missing=0
          for tool in nix jq git rg ssh python3 ${declared_tools}; do
            if command -v "${tool}" >/dev/null; then
              printf '  %-8s %s\n' "${tool}" "$(command -v "${tool}")"
            else
              printf '  %-8s MISSING\n' "${tool}"
              missing=1
            fi
          done
          if (( missing != 0 )); then
            echo "::error::.#devShells.<system>.default does not provide a tool the suites call"
            exit 1
          fi

      # The suites resolve sibling repositories as ../network-*, the developer
      # layout. Without them the cross-repository cases fail (or, worse, skip), and
      # the matrix only checks out one repository. Materialise every github input
      # this repository pins next to the workspace, which is exactly what the old
      # per-repository CI job did -- deleting that job deleted this step with it.
      - name: "Check out sibling repositories"
        # `sib_seen` dedupes the sibling stdenv warm below across repositories, and is
        # seeded with this repository's own stdenv so the common case -- a sibling that
        # now follows this lock -- is skipped instead of re-evaluated.
        env:
          sib_seen: ""
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"

          # NO `nix flake lock` here.
          #
          # Three of these repositories gitignore `flake.lock` (measured:
          # network-compiler, network-renderer-nixos, and the nixos repo), so
          # `[[ ! -f flake.lock ]] && nix flake lock` fired in EVERY test job and
          # resolved the whole input graph to answer a question about file paths:
          # measured in job 138861088165, "unpacking network-labs", "unpacking
          # nixpkgs/0182a361", "unpacking nixpkgs/ac56c456" -- ~200 MB per job, and
          # up to 288 jobs per sweep.
          #
          # The sibling list is just the `github:esp0xdeadbeef/<repo>` inputs, and a
          # lock, when it exists, only adds the revision. Both are readable without
          # Nix: python3 is on the image.
          python3 - "$RUNNER_TEMP/siblings.tsv" <<'PARSE'
          import json, re, sys

          out = {}
          lock_path = "flake.lock"
          try:
              lock = json.load(open(lock_path))
          except FileNotFoundError:
              lock = None

          flake = open("flake.nix").read()
          for name, repo in re.findall(
              r'([A-Za-z0-9_-]+)\.url\s*=\s*"github:esp0xdeadbeef/([A-Za-z0-9_.-]+)"', flake
          ):
              out[name] = [repo, "main"]

          if lock is not None:
              root = (lock.get("nodes", {}).get("root", {}) or {}).get("inputs", {})
              for alias, node_name in root.items():
                  node = lock.get("nodes", {}).get(node_name, {}) if isinstance(node_name, str) else {}
                  locked = node.get("locked", {}) or {}
                  if locked.get("type") == "github" and locked.get("owner") == "esp0xdeadbeef":
                      out[alias] = [locked.get("repo", ""), locked.get("rev", "main")]

          with open(sys.argv[1], "w") as handle:
              for name, (repo, rev) in sorted(out.items()):
                  handle.write(f"{name}\t{repo}\t{rev or 'main'}\n")
          print(f"siblings: {len(out)}")
          PARSE

          while IFS=$'\t' read -r name repo rev; do
            [[ -n "${name}" && -n "${repo}" ]] || continue
            [[ -e "${workspace}/${name}" ]] && continue
            echo "::group::sibling ${name} @ ${rev:0:10}"
            git init --quiet "${workspace}/${name}"
            git -C "${workspace}/${name}" remote add origin "https://github.com/esp0xdeadbeef/${repo}.git"
            # FULL HISTORY, NOT `--depth 1`.
            #
            # A shallow clone becomes a flake input as
            #   git+file:///...?rev=<rev>&shallow=1
            # and Nix cannot resolve a shallow repository's inputs, so it tries to
            # REWRITE that checkout's lock file -- which needs the network, which this
            # job has already closed:
            #
            #   error: … while updating the lock file of flake
            #     'git+file:///home/runner/work/network-labs/network-compiler?rev=5a8682f&shallow=1'
            #
            # (network-labs, FS-600-HDS-010-SDS-010-SMS-010 running a sibling's suite.)
            #
            # Fetching the history makes the sibling a flake Nix can evaluate as-is, so
            # no lock update is implied. The cost is one full clone per sibling per job.
            git -C "${workspace}/${name}" fetch --quiet origin "${rev}"
            git -C "${workspace}/${name}" checkout --quiet FETCH_HEAD
            # A SIBLING AT AN OLD REVISION MAY SHIP NO flake.lock.
            #
            # Three repositories in this fleet gitignore flake.lock, and a cross-repository
            # test evaluates a sibling at a pinned revision. With no lock, that
            # evaluation resolves `github:NixOS/nixpkgs` FRESHLY -- a nixpkgs nobody has
            # warmed, so the first build bootstraps from busybox:
            #
            #   these 1579 derivations will be built:
            #     ...-busybox.drv ...-bootstrap-tools.drv ...-stage0-posix-1.9.1-source.drv
            #
            # measured in network-forwarding-model and network-labs on a sibling pinned at
            # network-compiler@5a8682f, which has no flake.lock (verified: the checkout is
            # bare of one).
            #
            # Supplying this repository's lock gives the sibling deterministic pins, all of
            # which the cache step above has already materialised and realised. It is a
            # scratch checkout, so an untracked lock file there costs nothing.
            # A SIBLING'S OWN LOCK IS KEPT. DO NOT OVERWRITE IT.
            #
            # The suites do not evaluate a sibling THROUGH this flake -- they `cd` into the
            # sibling checkout and run `nix` there, so the sibling's own lock is the
            # pinning authority and every `follows` this flake declares is bypassed. That
            # is why pin drift is possible even when the responsible layer pins correctly,
            # and the fix belongs in the sibling's own flake (an absolute rev in an input
            # URL cannot be moved by a `follows` OR by a copied lock -- measured).
            #
            # Overwriting this lock was tried and is WRONG. A lock describes the graph of
            # the flake that wrote it; this repository's lock maps `root.inputs.network-compiler`,
            # so a sibling whose flake declares `network-labs` finds no entry for it, and
            # Nix then UPDATES the lock -- which is a network operation:
            #
            #   … while updating the lock file of flake
            #     'git+file:///.../network-compiler'
            #   … while fetching the input 'github:esp0xdeadbeef/network-labs'
            #   error: unable to download
            #     'https://api.github.com/repos/esp0xdeadbeef/network-labs/commits/HEAD':
            #     Could not resolve host: api.github.com
            #
            # measured in network-labs shard 0 after the overwrite shipped. With its own
            # lock restored, the same evaluation completes offline with no lock update.
            #
            # A sibling that ships NO lock cannot be served one either: any lock supplied
            # is the wrong graph, so the update happens anyway. Those checkouts are
            # reported, not patched, so the gap is visible instead of silent.
            if [[ ! -f "${workspace}/${name}/flake.lock" ]]; then
              echo "::warning::sibling ${name} ships no flake.lock; its evaluation cannot be offline"
            fi

            # WARM THE SIBLING'S OWN STDENV.
            #
            # A sibling that ships a lock keeps it, and its nixpkgs is a different
            # revision from this repository's -- so every stdenv the warm step
            # realised above is the wrong one for it. The first suite to evaluate the
            # sibling then rebuilt the entire bootstrap toolchain from source and died
            # on the network:
            #
            #   these 1534 derivations will be built:
            #     .../bootstrap-tools.tar.xz.drv
            #   error: unable to download 'http://tarballs.nixos.org/stdenv/...':
            #     Could not resolve host: tarballs.nixos.org
            #
            # measured in network-labs shard 0 running network-compiler's
            # FS-030-HDS-010-SDS-010-SMS-010. Realising the sibling's stdenv here is
            # the difference between that and a cache hit.
            #
            # Deduped by derivation across siblings (a fleet-wide update can leave two
            # repositories on one nixpkgs), and it must never fail the job: a sibling
            # that cannot be evaluated is the test's business, not the warm step's.
            if [[ -f "${workspace}/${name}/flake.nix" ]]; then
              sib_drv="$(cd "${workspace}/${name}" && timeout 120 nix eval --raw --impure \
                --expr "(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.${system}.stdenv.drvPath" \
                2>/dev/null)" || sib_drv=""
              if [[ -n "${sib_drv}" ]]; then
                case " ${sib_seen} " in
                  *" ${sib_drv} "*) printf '  sibling stdenv already realised\n' ;;
                  *) if timeout 600 nix-store -r "${sib_drv}" > /dev/null 2>&1; then
                       sib_seen="${sib_seen} ${sib_drv}"
                       printf '  sibling stdenv realised: %s\n' "$(basename "${sib_drv}" .drv)"
                     else
                       echo "::warning::sibling ${name} stdenv could not be realised"
                     fi ;;
                esac
              fi
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/siblings.tsv"

      # ONE LOUD ERROR INSTEAD OF TWO HUNDRED DNS ERRORS.
      #
      # A suite enters a sibling checkout and runs `nix` there, so the sibling's own
      # flake.lock is the pinning authority. If that lock does not describe the sibling's
      # flake, Nix UPDATES it -- a network operation -- and with the store closed and the
      # network namespace up, every such test fails with the same unhelpful line:
      #
      #   … while updating the lock file of flake 'git+file:///.../network-compiler'
      #   … while fetching the input 'github:esp0xdeadbeef/network-labs'
      #   error: unable to download
      #     'https://api.github.com/repos/esp0xdeadbeef/network-labs/commits/HEAD':
      #     Could not resolve host: api.github.com
      #
      # It is one condition, measured once, and reported here before any suite runs.
      # This is the check that would have caught a foreign flake.lock being written into
      # a sibling: with this repository's lock copied into network-compiler's checkout,
      # the evaluation below reports "updating the lock file" and fails.
      - name: "Siblings evaluate with a closed store"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'SIBLING_GATE'
          #!/usr/bin/env python3
          """Fail if a sibling checkout cannot be evaluated with a closed store.

          A suite `cd`s into a sibling and runs `nix` there, so the sibling's own flake.lock is
          the pinning authority. When that lock does not cover the flake's inputs, Nix UPDATES
          the lock -- a network operation -- and every test that touches the sibling dies with

            … while updating the lock file of flake 'git+file:///.../network-compiler'
            … while fetching the input 'github:esp0xdeadbeef/network-labs'
            error: unable to download
              'https://api.github.com/repos/esp0xdeadbeef/network-labs/commits/HEAD':
              Could not resolve host: api.github.com

          The condition is two static facts, so it is checked statically:

            1. the checkout has a flake.lock at all, and
            2. every input named in flake.nix is mapped by the lock's root node.

          Rule 2 is what catches a FOREIGN lock: writing network-labs' lock into
          network-compiler's checkout leaves `network-labs` (declared by compiler's flake) with
          no root mapping, which is precisely the state that made Nix rewrite the lock.

          `nix eval --offline` is not usable as the detector: Nix caches flake resolutions, so on
          any machine with a warm cache the evaluation succeeds even with no lock present.
          """
          import json
          import pathlib
          import re
          import sys

          INPUT = re.compile(r'^\s*([A-Za-z0-9_-]+)\.url\s*=\s*"', re.M)

          bad = []
          for d in sorted(pathlib.Path("..").glob("network-*")):
              flake = d / "flake.nix"
              if not flake.is_file():
                  continue
              declared = {m.group(1) for m in INPUT.finditer(flake.read_text())}
              lock_path = d / "flake.lock"
              if not lock_path.is_file():
                  bad.append((d.name, "ships no flake.lock, so its inputs must be resolved over the network"))
                  continue
              try:
                  lock = json.loads(lock_path.read_text())
              except json.JSONDecodeError as exc:
                  bad.append((d.name, f"flake.lock is not valid JSON: {exc}"))
                  continue
              root = lock.get("nodes", {}).get(lock.get("root", "root"), {}).get("inputs", {})
              missing = sorted(declared - set(root))
              if missing:
                  bad.append((
                      d.name,
                      "flake.lock does not map " + ", ".join(f"`{m}`" for m in missing)
                      + " -- the lock does not describe this flake and Nix would rewrite it",
                  ))

          if bad:
              for name, why in bad:
                  print(f"::error file=../{name}/flake.lock::{name}: {why}")
              print("::error::a sibling cannot be evaluated with a closed store; regenerate that "
                    "repository's lock (nix flake lock) and commit it, or the tests will fail on DNS")
              sys.exit(1)
          print(f"PASS SIBLING-OFFLINE: {len(list(pathlib.Path('..').glob('network-*')))} sibling "
                f"checkout(s) have a lock that describes their flake")
          SIBLING_GATE

      # Siblings the tests need but flake.lock CANNOT pin, with a reason.
      #
      # `tests/test-canonical-collection-loss.sh` imports
      # network-realization-model/src/default.nix directly, because the check it
      # audits (canonicalFor) lives there. It cannot be a flake input: this
      # repository is an input OF network-realization-model, so pinning it back
      # would be a cycle. Without this step the suite failed with
      #
      #   FAIL CANONICAL-COLLECTION-LOSS: no realization-model checkout at
      #   .../network-realization-model
      #
      # which is the correct behaviour for the test (it refuses to pass without the
      # thing it audits) and an unmet dependency for CI. The revision is main at the
      # time of the run, exactly as a developer's ../network-realization-model is: a
      # test that audits another repository's current code and pins that code would
      # only ever audit the pin.
      - name: "Check out the realization model (unpinnable sibling)"
        # One shared workflow for the whole fleet: the step is present everywhere and
        # runs only where the test that needs it exists. An unconditional step here
        # forks this file, and a forked workflow is a gate that answers differently per
        # repository.
        if: hashFiles('tests/test-canonical-collection-loss.sh') != ''
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(dirname "$GITHUB_WORKSPACE")"
          target="${workspace}/network-realization-model"
          [[ -e "${target}" ]] && exit 0
          git init --quiet "${target}"
          git -C "${target}" remote add origin "https://github.com/esp0xdeadbeef/network-realization-model.git"
          # Full history for the same reason as the pinned siblings above: a shallow
          # checkout cannot be evaluated as a flake without rewriting its lock.
          git -C "${target}" fetch --quiet origin main
          git -C "${target}" checkout --quiet FETCH_HEAD
          # Same reason as the pinned siblings: a revision without a lock evaluates a
          # freshly resolved nixpkgs, which nothing has warmed.
          if [[ ! -f "${target}/flake.lock" && -f flake.lock ]]; then
            cp flake.lock "${target}/flake.lock"
          fi

      - name: "Run ${{ matrix.test || format('shard {0}', matrix.shard) }}"
        shell: bash
        env:
          # Matrix values are derived from filenames, which a pull request controls.
          # They are passed as ENVIRONMENT, never spliced into a shell line: a file
          # called `test-$(curl ...).sh` would otherwise be executed by the step that
          # is supposed to run it. ${{ }} in `run:` is codegen, not quoting.
          TEST_NAME: ${{ matrix.test }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.list.outputs.shards }}
          SHARD_SIZE: ${{ needs.list.outputs.shard_size }}
          NETWORK_REPO_DIRECT_TEST_OK: "1"
          # tests/test-s88-ci-gate.sh reads the last CI run; without a token it
          # fails closed inside CI (auth missing is a defect there, not an
          # environment fact), so the matrix job hands it one. Read-only: see the
          # permissions block above.
          # Empty on a fork pull request. GitHub already withholds secrets and gives a
          # read-only token there; not handing one over at all removes the question,
          # and S88_CI_GATE is off in that case so nothing needs it. On a same-repo
          # branch PR the workflow file itself is attacker-controlled, which is why
          # permissions stay read-only: see the block at the top.
          GH_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && '' || github.token }}
          # Off for a fork pull request: the gate asks "is main green before we
          # start", which is not a question an untrusted branch can answer, and a
          # fork's token cannot read the base repository's history. Explicit off is
          # recorded as skipped, never as passed.
          S88_CI_GATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'off' || 'on' }}
          # The store was closed in the "Close the store" step above, for both the
          # file and the environment. This records the intent for the log assertion.
          NIX_OFFLINE: "1"
        run: |
          set -uo pipefail
          # `flake-archive-offline` ON PATH.
          #
          # The suites resolved flake inputs with `nix flake archive --json`, which copies
          # every input into the store and therefore downloads `github:owner/repo/<rev>`
          # tarballs. The rev that failed was not the test's -- it came from a sibling's
          # lock, and a github: tarball and a git checkout of the same rev are different
          # store paths, so the sibling checkout CI already made could never satisfy it:
          #
          #   unpacking 'github:esp0xdeadbeef/network-compiler/22dbbbc...' into the Git cache...
          #   error: unable to download
          #     'https://github.com/esp0xdeadbeef/network-compiler/archive/22dbbbc....tar.gz':
          #     Could not resolve host: github.com
          #
          # The shim answers from the sibling checkouts instead. It is exported here, at the
          # top of the step: the `exec ... env ... script` line below is a single continued
          # command, and splicing into it turns the shell keywords into arguments -- which
          # is exactly how a previous attempt produced "no run transcript at
          # ${RUNNER_TEMP}/run.log" and failed every test job in the fleet.
          if [[ -d tests/lib/bin ]]; then
            export PATH="${PWD}/tests/lib/bin:${PATH}"
          fi
          # `script(1)` gives the test a pty and tees everything it prints to
          # ${RUNNER_TEMP}/run.log, in order, stdout and stderr together. A plain
          # `2>&1 | tee` loses the interleaving Nix uses on a tty, and the assertion
          # in the next step greps this file. `-e` propagates the test's exit status,
          # which is why the if/else below still sees a failure as a failure.
          command -v script >/dev/null || { echo "util-linux script(1) is required" >&2; exit 1; }
          # The test runs INSIDE the network namespace, using whichever form the host
          # offers (see "Verify the test can run with no network").
          #
          # The test name is expanded by the shell `script -c` starts, from the
          # environment -- never spliced into this line, because a filename a pull
          # request controls would otherwise be code here.
          #
          # It is passed explicitly through `env`, and not left to inheritance: the
          # namespace prefix is `sudo -n env PATH=... unshare -n`, and `sudo` scrubs the
          # environment, so an inherited TEST_NAME arrives empty and run-one.sh is asked
          # for `tests/` -- measured in run 45526062867, "error: no such test: tests/".
          if [[ -n "${TEST_NAME:-}" ]]; then
            exec ${NIX_NETNS:?} \
              env TEST_NAME="${TEST_NAME}" \
                  NETWORK_REPO_DIRECT_TEST_OK="${NETWORK_REPO_DIRECT_TEST_OK:-0}" \
                  NETWORK_REPO_SWEEP="${NETWORK_REPO_SWEEP:-0}" \
              script -q -e -c 'bash tests/run-one.sh "tests/${TEST_NAME}"' "${RUNNER_TEMP}/run.log"
          fi

          # SHARD MODE: this job owns every entrypoint whose index % shards == shard.
          #
          # Used only for suites above GitHub's 256-job matrix cap (network-labs
          # discovers 486). The discovery and sort must match `list`'s exactly, or a
          # shard runs a different slice than it was counted for.
          if [[ -f scripts/lib/discover-tests.sh ]]; then
            # shellcheck source=/dev/null
            source scripts/lib/discover-tests.sh
            mapfile -t names < <(discover_tests "$PWD")
          else
            mapfile -t names < <(
              find tests -maxdepth 1 -type f \
                \( -name 'test-*.sh' -o -name 'test_*.py' \
                   -o -regex '.*/FS-[0-9]+-HDS-[0-9]+-SDS-[0-9]+-\(SMS\|SIT\)-[0-9a-z][a-z0-9-]*\(-[a-z0-9-]+\)?\.\(sh\|py\)' \) \
                ! -name 'test.sh' -printf '%f\n' | LC_ALL=C sort
            )
          fi
          mine=()
          for i in "${!names[@]}"; do
            (( i % SHARDS == SHARD )) && mine+=("${names[$i]}")
          done
          printf 'shard %s/%s owns %s of %s test(s)\n' "${SHARD}" "${SHARDS}" "${#mine[@]}" "${#names[@]}"
          failures=0
          : > "${RUNNER_TEMP}/run.log"
          for name in "${mine[@]}"; do
            if ! ${NIX_NETNS:?} \
                   env TEST_NAME="${name}" \
                       NETWORK_REPO_DIRECT_TEST_OK="${NETWORK_REPO_DIRECT_TEST_OK:-0}" \
                       NETWORK_REPO_SWEEP="${NETWORK_REPO_SWEEP:-0}" \
                   script -q -e -a -c "bash tests/run-one.sh \"tests/${name}\"" "${RUNNER_TEMP}/run.log"; then
              failures=$((failures + 1))
            fi
          done
          printf 'shard %s/%s: %s of %s failed\n' "${SHARD}" "${SHARDS}" "${failures}" "${#mine[@]}"
          (( failures == 0 )) || exit 1

          # The same discovery and the same sort as the list job, so shard N owns
          # exactly the tests it was counted for: index % shards == N.
          if [[ -f scripts/lib/discover-tests.sh ]]; then
            # shellcheck source=/dev/null
            source scripts/lib/discover-tests.sh
            mapfile -t names < <(discover_tests "$PWD")
          else
            mapfile -t names < <(
              find tests -maxdepth 1 -type f \
                \( -name 'test-*.sh' -o -name 'test_*.py' \
                   -o -regex '.*/FS-[0-9]+-HDS-[0-9]+-SDS-[0-9]+-\(SMS\|SIT\)-[0-9a-z][a-z0-9-]*\(-[a-z0-9-]+\)?\.\(sh\|py\)' \) \
                ! -name 'test.sh' -printf '%f\n' | LC_ALL=C sort
            )
          fi
          mine=()
          for i in "${!names[@]}"; do
            (( i % SHARDS == SHARD )) && mine+=("tests/${names[$i]}")
          done
          printf 'shard %s/%s runs %s test(s)\n' "${SHARD}" "${SHARDS}" "${#mine[@]}"
          failures=0
          for test_path in "${mine[@]}"; do
            if ! ${NIX_NETNS:?} env TEST_PATH="${test_path}" \
                   NETWORK_REPO_DIRECT_TEST_OK="${NETWORK_REPO_DIRECT_TEST_OK:-0}" \
                   NETWORK_REPO_SWEEP="${NETWORK_REPO_SWEEP:-0}" \
                   script -q -e -c 'bash tests/run-one.sh "${TEST_PATH}"' "${RUNNER_TEMP}/run.log"; then
              failures=$((failures + 1))
            fi
          done
          printf 'shard %s/%s: %s of %s failed\n' "${SHARD}" "${SHARDS}" "${failures}" "${#mine[@]}"
          (( failures == 0 )) || exit 1

      # THE PROOF, ON THE REAL OUTPUT, IN EVERY JOB.
      #
      # The user's question was whether the cache is hitting EVERYWHERE, and the
      # honest answer found by reading the logs was: the /nix cache hit, and the test
      # still substituted. So the assertion is on the transcript the test produced,
      # not on the cache step's own "Cache restored" line.
      #
      # `always()`: when a test fails because it needed something the warm job did not
      # cover, the interesting line is in this grep, and skipping it on failure would
      # hide exactly that.
      - name: "Assert the run was offline"
        if: always()
        shell: bash
        env:
          TEST_NAME: ${{ matrix.test }}
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/run.log"
          # If the transcript is missing, say so instead of passing vacuously -- a
          # check over zero lines is the same class of bug as a suite over zero tests.
          if [[ ! -s "${log}" ]]; then
            echo "::error::no run transcript at ${log}; the offline assertion cannot be made"
            exit 1
          fi
          # Every way a substitution announces itself in a Nix log, plus the two hosts
          # the suites touch when they fall out of the store.
          pattern='copying path .+ from|substituting .+|downloading .+ from|curl: \(|cache\.nixos\.org|channels\.nixos\.org'
          if matches="$(grep -aEn "${pattern}" "${log}")"; then
            echo "::error::the test fetched from the network; the store was supposed to be closed"
            printf '%s\n' "${matches}" | head -40
            exit 1
          fi
          # A PASS THAT REQUIRES THE TEST TO HAVE ACTUALLY RUN.
          #
          # The first version of this step printed "PASS OFFLINE ... 0 substitutions"
          # for a job whose test had died after 7 lines with "the build users group
          # 'nixbld' has no members" (run 45527121607). A test that fails immediately
          # substitutes nothing, so "0 substitutions" was true and worthless: the
          # evidence said nothing about the run, only about how early it stopped.
          #
          # So the assertion now also requires that the test PASSED, and that it
          # produced a transcript long enough to be a run rather than a single error
          # line. A failing test is still reported as a failure -- the run step already
          # fails -- but it no longer doubles as offline evidence.
          lines="$(wc -l < "${log}")"
          if grep -qE '^FAIL |^FAIL$|declared SKIP' "${log}"; then
            echo "::error::the test failed, so this transcript is not evidence of an offline run"
            # PRINT WHAT FAILED. The step failing here is the only signal an operator or an
            # agent gets when the job-log API will not stream (measured twice on
            # 2026-11-27: `gh api .../logs` returned nothing for every attempt), and the
            # failure is indistinguishable from an environment fault without this tail.
            # Diagnostics only: the gate above already decided, and nothing below relaxes it.
            printf '%s\n' '--- last 60 transcript lines (diagnostic) ---'
            tail -n 60 "${log}"
            printf '%s\n' '--- end transcript ---'
            # ALSO AS AN ANNOTATION. The transcript above lands in the job log, and the job
            # log is exactly what could not be fetched when this was written (two
            # repositories, 2026-11-27: `gh api .../logs` empty, `gh run view --log` =
            # "stream error ... CANCEL"). Annotations are readable through a different
            # endpoint, so the cause survives even when the log does not.
            summary="$(tail -n 20 "${log}" | tr '\r' ' ' | sed -n 's/::/#/g;p' | paste -sd'|' - | cut -c1-1200)"
            printf '::error::transcript tail: %s\n' "${summary}"
            exit 1
          fi
          if ! grep -qE '^PASS ' "${log}"; then
            echo "::error::no PASS line in the transcript; the test did not complete"
            exit 1
          fi
          # WHAT COUNTS AS EVIDENCE, AFTER THREE WRONG ANSWERS.
          #
          # Attempt 1 accepted any job that printed "PASS OFFLINE ... 0 substitutions",
          # including one whose test had died after 7 lines (run 45527121607).
          # Attempt 2 required 20 lines and rejected FS-165 (10 lines, run 45528415884).
          # Attempt 3 required the transcript to mention nix or a store path, and
          # rejected FS-030-HDS-010-SDS-020-SMS-010 (run 45531637354), which ran 13
          # compile cases and printed a PASS summary -- it uses nix through a helper and
          # reports outcomes, not commands.
          #
          # All three were proxies for one question: DID THE TEST ACTUALLY RUN? The
          # answer is already in the job:
          #
          #   * the test exited 0 and printed `PASS` -- a test that dies prints none;
          #   * it ran inside `sudo -n unshare -n`, so a fetch could not have happened;
          #   * its transcript is grepped for every substitution spelling below.
          #
          # So those are the criteria, and no length or content heuristic is added on
          # top. A test that legitimately does not touch nix is still evidence that the
          # SUITE runs offline; a test that fakes it would have to exit 0, print PASS,
          # and survive the grep, which is exactly what the other gates already deny.
          printf 'PASS OFFLINE %s: test passed, %s lines of transcript, 0 substitutions, 0 cache.nixos.org fetches\n' \
            "${TEST_NAME:-shard}" "${lines}"
