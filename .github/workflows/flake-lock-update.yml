name: "Flake.lock: update and push"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: "flake-lock-update"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: "Update flake.lock"
        run: nix flake update

      - name: "Check flake outputs"
        run: nix flake check -L --show-trace

      - name: "Commit and push"
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): update flake.lock"
          git push
