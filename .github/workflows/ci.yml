name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancel a superseded run on a PULL REQUEST, never on main.
  #
  # A main run is the record of that commit: cancelling it destroys the only
  # evidence of whether the commit was good, and it is what a red/green history is
  # read from. Fine while commits land minutes apart; measured, ten pushes in
  # fifteen minutes (two agents) left every matrix run but the first "cancelled",
  # so the fleet had no results at all.
  #
  # A pull-request run for a commit that has been superseded is worth nothing, so
  # cancelling there is pure savings.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Evaluate-only gate: the repository test suite below builds and runs the real artifacts, so avoid duplicating the build here.
      - name: "Check flake outputs"
        run: nix flake check --no-build -L --show-trace
